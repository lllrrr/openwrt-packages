<style>
:root {
  --bg: #0f1724;
  --panel: #172033;
  --line: #263247;
  --text: #e8eef8;
  --muted: #8ea0b8;
  --loss: #ff5d73;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
body { padding: 18px; }
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; position: relative; cursor: grab; user-select: none; touch-action: none; }
.card:active { cursor: grabbing; }
.card.dragging { opacity: .45; }
.card.drag-over { outline: 2px dashed #4d7fd6; }
.card .name { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.card .val { font-size: 32px; font-weight: 700; line-height: 1.15; margin: 6px 0 8px; }
.card .val small { font-size: 16px; color: var(--muted); margin-left: 4px; }
.meta { font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.xbtn { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 2px; }
.xbtn:hover { color: var(--loss); }
.toolbar, .addbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.btn, input, select {
  background: #101a2b; color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; font-size: 13px;
}
.btn { cursor: pointer; }
.btn.active { background: #2a4d86; border-color: #4d7fd6; }
.btn.preset { border-style: dashed; }
.btn.disabled { opacity: .45; cursor: default; }
input { min-width: 160px; }
.chart-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 8px; }
canvas { width: 100%; height: 420px; display: block; cursor: crosshair; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 6px 4px 2px; flex-wrap: wrap; }
.foot { margin-top: 10px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.tip { position: fixed; pointer-events: none; background: #0c1320; border: 1px solid var(--line); color: var(--text); padding: 8px 10px; border-radius: 10px; font-size: 12px; display: none; z-index: 9; }
.stale { color: var(--loss); }
.err { color: var(--loss); font-size: 13px; }
.method { display:inline-block; margin-left:6px; padding:1px 6px; border:1px solid var(--line); border-radius:999px; font-size:10px; color:var(--muted); }

.series-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.series-filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.chip {
  display:inline-flex; align-items:center; gap:6px;
  background:#101a2b; color:var(--text); border:1px solid var(--line);
  border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; user-select:none;
}
.chip.on { background:#2a4d86; border-color:#4d7fd6; }
.chip.off { opacity:.42; }
.chip:hover { border-color:#4d7fd6; }
.series-count { color:var(--muted); font-size:12px; }

@media (max-width: 900px) { canvas { height: 320px; } }

/* Light monitoring dashboard inspired by the supplied reference */
:root { --bg:#eef4f7; --panel:rgba(255,255,255,.90); --line:#e1e9ee; --text:#26313b; --muted:#84909b; --green:#27a55d; --blue:#159bd1; --yellow:#e7a400; --loss:#e35353; }
html,body { background:linear-gradient(135deg,#eef6f8 0%,#f8fafb 52%,#eaf1f4 100%); color:var(--text); }
body { max-width:1280px; margin:0 auto; padding:18px 32px 36px; }
.topnav { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }

.navitem.active { background:#fff; color:#1d2c36; box-shadow:0 4px 16px rgba(50,80,100,.08); }
.hero { background:var(--panel); border:1px solid rgba(219,230,236,.9); border-radius:18px; padding:20px 24px; display:flex; align-items:center; gap:18px; box-shadow:0 8px 26px rgba(50,80,100,.06); margin-bottom:14px; }
.health { width:54px; height:54px; border-radius:50%; border:3px solid var(--green); color:var(--green); display:grid; place-items:center; font-size:32px; font-weight:700; flex:none; }
.hero h1 { margin:0; font-size:21px; } .hero .sub { margin:3px 0 0; }
.hero-stats { display:flex; gap:28px; margin-left:18px; flex-wrap:wrap; } .hero-stat b { display:block; font-size:21px; color:#27343d; } .hero-stat span { color:var(--muted); font-size:11px; }
.overview-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
.overview-card { background:var(--panel); border:1px solid var(--line); border-radius:15px; min-height:90px; padding:15px 16px; box-shadow:0 5px 18px rgba(50,80,100,.04); }
.overview-card .label { color:#78858f; font-size:12px; font-weight:700; } .overview-card .big { color:var(--green); font-size:27px; font-weight:800; margin-top:5px; } .overview-card .small { color:var(--muted); font-size:11px; margin-top:3px; }
.cards { grid-template-columns:repeat(3,minmax(240px,1fr)); } .card { background:var(--panel); border-color:var(--line); border-radius:15px; box-shadow:0 5px 18px rgba(50,80,100,.04); }
.card .val { color:var(--green); } .card .meta,.card .name { color:var(--muted); } .dot { width:9px;height:9px; }
.toolbar,.addbar,.series-bar { background:rgba(255,255,255,.62); border:1px solid var(--line); border-radius:13px; padding:10px; }
.btn,input,select { background:#fff; color:var(--text); border-color:#d9e3e8; } .btn.active { background:#e5f6ed; border-color:#a9ddbd; color:#238c50; }
.btn.preset { border-color:#b8d6e4; } .chart-wrap { background:var(--panel); border-color:var(--line); box-shadow:0 5px 18px rgba(50,80,100,.04); } canvas { height:380px; } .method { border-color:#d7e3e8; }
.settings { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:15px; padding:13px; margin-bottom:14px; }
.setting { display:flex; flex-direction:column; gap:5px; color:#78858f; font-size:11px; font-weight:700; } .setting .btn { width:100%; }
.region-select { min-width:120px; } .region-badge { display:inline-block; margin-left:5px; border-radius:999px; padding:2px 7px; font-size:10px; background:#edf7ff; color:#2580b1; }
@media(max-width:900px){body{padding:14px}.overview-grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,minmax(220px,1fr))}.settings{grid-template-columns:repeat(2,1fr)}.hero-stats{margin-left:0}}
@media(max-width:600px){.overview-grid,.cards,.settings{grid-template-columns:1fr}.hero{align-items:flex-start}.hero-stats{gap:15px}}
</style>
</head>

<script>
// The two panels use the same append-only carrier IDs and device-scoped marking.
function createCarrierPanel(api, onFilter) {
  var names=['未标记 / 未识别','中国移动','中国联通','中国电信','中国广电','其他运营商','切换中'];
  var selected='all', busy=false, state={}, generation=0;
  function el(tag,text,attrs) {
    var n=document.createElement(tag); if(text!=null)n.textContent=text;
    Object.keys(attrs||{}).forEach(function(k){n.setAttribute(k,attrs[k]);}); return n;
  }
  function option(select,value,label){select.appendChild(el('option',label,{value:String(value)}));}
  function select(label) {var s=el('select',null,{'aria-label':label,class:'cbi-input-select btn'});s.style.cssText='width:auto;max-width:100%;min-width:130px';return s;}
  var root=el('section',null,{class:'cbi-section carrier-panel'});root.style.cssText='border:1px solid rgba(128,128,128,.25);border-radius:12px;padding:14px;margin:12px 0;background:transparent';
  root.appendChild(el('h3','运营商切换与对比'));
  var current=el('p','正在识别当前运营商…',{'aria-live':'polite'});root.appendChild(current);
  var controls=el('div');controls.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center';root.appendChild(controls);
  var filter=select('历史运营商筛选');option(filter,'all','全部运营商');names.forEach(function(n,i){option(filter,i,n);});
  controls.appendChild(el('label','历史筛选'));controls.appendChild(filter);
  filter.addEventListener('change',function(){selected=filter.value;onFilter(selected);});
  var mark=select('当前 SIM 的运营商标记');option(mark,'auto','自动识别（推荐）');names.slice(0,6).forEach(function(n,i){option(mark,i,n);});
  var save=el('button','保存标记',{type:'button',class:'cbi-button btn'});
  controls.appendChild(el('label','当前卡标记'));controls.appendChild(mark);controls.appendChild(save);
  var sim=select('切换数据 SIM');option(sim,0,'SIM 1');option(sim,1,'SIM 2');
  var change=el('button','切换数据 SIM',{type:'button',class:'cbi-button cbi-button-action btn'});controls.appendChild(sim);controls.appendChild(change);
  var message=el('p','',{'aria-live':'polite'});root.appendChild(message);
  var note=el('p','筛选只影响历史曲线；总流量和原有历史继续保留。旧数据归入未标记；换卡未识别时不猜测运营商。手动标记绑定当前 SIM，不会沿用到新卡。');note.style.cssText='font-size:12px;opacity:.8;line-height:1.6';root.appendChild(note);
  var report=el('div');report.style.overflowX='auto';root.appendChild(report);
  function failure(error){var errors={invalid_carrier:'无效的运营商',sim_not_identified:'当前卡尚未识别，请等联网并自动识别完成后再标记',dual_sim_unavailable:'设备不支持双卡软件切换；可手动拔插 SIM，联网后自动归档',invalid_sim:'无效的卡槽',carrier_unavailable:'运营商服务暂不可用',storage_failed:'标记保存失败'};message.textContent='操作失败：'+(errors[error]||String(error||'未知错误'));}
  function paint(s){
    state=s||{};if(!state.ok){failure(state.error);return;}
    current.textContent='当前：'+(names[state.code]||names[0])+(state.sim>=0?' · SIM '+(Number(state.sim)+1):'')+' · '+(state.source==='manual'?'手动标记':state.source==='auto'?'自动识别':state.source==='switching'?'正在切换':'等待识别');
    if(document.activeElement!==mark)mark.value=state.mode||'auto';
    save.disabled=busy||state.sim<0||state.code===6;
    sim.disabled=change.disabled=busy||!state.switch_supported||state.code===6;
    if(!busy&&document.activeElement!==sim)sim.value=state.sim===0?'1':'0';
    change.title=state.switch_supported?'使用设备原有双 SIM 切换接口':'此设备不支持双卡软件切换；手动换卡后自动归档';
  }
  function refresh(){var id=++generation;return api('status').then(function(s){if(id===generation)paint(s);}).catch(function(e){message.textContent='识别暂不可用：'+e.message;});}
  save.addEventListener('click',function(){busy=true;save.disabled=true;api('set',mark.value).then(function(r){if(!r.ok){failure(r.error);return;}paint(r);message.textContent='标记已保存，仅用于后续记录；已有历史未改变。';onFilter(selected);}).catch(function(e){failure(e.message);}).finally(function(){busy=false;refresh();});});
  function follow(id,tries){
    return api('job',id).then(function(r){
      if(r.state==='done'){message.textContent='切换成功，等待新运营商识别；历史和累计流量继续保留。';busy=false;refresh();onFilter(selected);return;}
      if(r.state==='error'||!r.state){busy=false;failure(r.error||'无法读取切换结果，请到 SIM 管理页确认');refresh();return;}
      if(tries>=160){busy=false;message.textContent='切换结果尚未确认，请到设备 SIM 管理页查看；监控继续记录。';refresh();return;}
      window.setTimeout(function(){follow(id,tries+1);},1500);
    }).catch(function(e){busy=false;failure(e.message);refresh();});
  }
  change.addEventListener('click',function(){
    if(busy||!state.switch_supported)return;
    if(!window.confirm('切换到 SIM '+(Number(sim.value)+1)+' 会暂时断开公网连接。监控历史和总流量保留。确认切换？'))return;
    busy=true;change.disabled=sim.disabled=save.disabled=true;message.textContent='正在提交切换…';
    api('switch',sim.value).then(function(r){if(!r.ok||!r.id){busy=false;failure(r.error);refresh();return;}message.textContent='正在切换，请稍候…';follow(r.id,0);}).catch(function(e){busy=false;failure(e.message);refresh();});
  });
  function showReport(rows,targets){
    report.replaceChildren(); if(!rows||!rows.length){report.appendChild(el('p','此查询范围还没有可对比的记录。'));return;}
    var wan=rows[0].target!=null,table=el('table',null,{class:'table'});table.style.cssText='width:100%;min-width:620px;font-size:12px';
    var head=el('tr');(wan?['运营商','目标','采样数','平均延迟','最低 / 最高','丢包率']:['运营商','采样数','下载 / 上传','阿里平均 / 丢包','腾讯平均 / 丢包']).forEach(function(t){head.appendChild(el('th',t));});table.appendChild(head);
    function ms(v){return v==null?'--':Number(v).toFixed(1)+' ms';}
    function percent(v){return Number(v||0).toFixed(1)+'%';}
    function bytes(v){return (Number(v||0)/1e9).toFixed(4)+' GB';}
    rows.forEach(function(r){var id=wan?r.carrier:r.id,tr=el('tr');if(selected!=='all'&&Number(selected)!==Number(id))tr.style.opacity='.55';
      var target=(targets||[]).find(function(t){return t.id===r.target;});
      var cols=wan?[names[id],target?target.name:r.target,r.count,ms(r.avg),ms(r.min)+' / '+ms(r.max),percent(r.loss)]:[names[id],r.count,bytes(r.download)+' / '+bytes(r.upload)+(r.unaccounted?'（旧记录流量未分组）':''),ms(r.aliyun_avg)+' / '+percent(r.aliyun_loss),ms(r.tencent_avg)+' / '+percent(r.tencent_loss)];
      cols.forEach(function(v){tr.appendChild(el('td',v));});table.appendChild(tr);
    });report.appendChild(table);
    report.appendChild(el('p','对比范围与历史查询一致；仅比较各网络实际采样，不把其他运营商的时段算成丢包。切换中数据单列；分组流量从新版开始累计，旧总流量不变。'));
  }
  return {node:root,refresh:refresh,report:showReport,value:function(){return selected;}};
}

const PRESETS = [
  {id:"ali", name:"阿里云", host:"223.5.5.5"},

const HIDDEN_KEY = "wan-latency-hidden";
let hoverX = null, drag = null, hidden = {};
function loadHidden(){
  try { hidden = JSON.parse(localStorage.getItem(HIDDEN_KEY) || "{}") || {}; }
  catch (e) { hidden = {}; }
  if (!hidden || typeof hidden !== "object" || Array.isArray(hidden)) hidden = {};
}
function saveHidden(){
  try { localStorage.setItem(HIDDEN_KEY, JSON.stringify(hidden)); } catch (e) {}
}
function visibleTargets(){
  return ((data && data.targets) || []).filter(t => !hidden[t.id]);
}
function setHidden(id, isHidden){
  if (isHidden) hidden[id] = true; else delete hidden[id];
  saveHidden();
}

function pad(n){ return String(n).padStart(2,"0"); }
function fmtTime(ts){
  const d = new Date(ts * 1000);
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function toLocalInput(ts){
  const d = new Date(ts * 1000);
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function fromLocalInput(v){ return v ? Math.floor(new Date(v).getTime()/1000) : null; }
function fmtMs(v){ return (v==null || isNaN(v)) ? "--" : Number(v).toFixed(1); }
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
function methodLabel(v){ return ({icmp:"ICMP",tcp443:"TCP 443",tcp80:"TCP 80",dns:"DNS",failed:"失败",unknown:"未知"})[v] || String(v || "未知"); }

function updatePresetButtons(){
  const ids = (data && data.targets || []).map(t => t.id);
  const hosts = (data && data.targets || []).map(t => t.host);
  PRESETS.forEach(p => {
    const btn = document.getElementById("p_" + p.id);
    const on = ids.includes(p.id) || hosts.includes(p.host);
    btn.classList.toggle("disabled", on);
    btn.textContent = on ? ("已有 " + p.name) : ("+ " + p.name);
  });
}

function currentTargets(){
  const configured = data && data.targets;
  if (Array.isArray(configured)) return configured;
  return ((data && data.latest && data.latest.items) || []).map(item => ({
    id: item.id, name: item.name || item.host || item.id, host: item.host || item.ip || "",
    color: item.color || "#159bd1", region: item.region || "auto"
  }));
}

function renderCards(){
  if (cardDrag) return;
  const box = document.getElementById("realtimeSection");
  const targets = currentTargets();
  const stats = (data && data.stats) || {};
  const latestItems = ((data && data.latest && data.latest.items) || []);
  const latestMap = {};
  latestItems.forEach(it => { latestMap[it.id] = it; });
  if (!targets.length) {
    box.innerHTML = '<div class="card"><div class="name">还没有探测目标</div><div class="meta">点上面的预设，或自己填一个地址</div></div>';
    return;
  }
  box.innerHTML = targets.map(t => {
    const st = stats[t.id] || {};
    const cur = (latestMap[t.id] && latestMap[t.id].rtt != null) ? latestMap[t.id].rtt : null;
    const liveItem = latestMap[t.id] || {};
    const ip = liveItem.ip && liveItem.ip !== t.host ? liveItem.ip : "";
    const region = t.region === "domestic" ? "国内" : (t.region === "foreign" ? "国外" : "自动");
    return '<div class="card" draggable="true" data-id="' + t.id + '" title="拖动可调整顺序">' +
      '<div class="name"><span><span class="dot" style="background:' + esc(t.color) + '"></span>' + esc(t.name) + ' ' + esc(t.host) + '<span class="region-badge">' + region + '</span>' + (ip ? " / " + esc(ip) : "") + '<span class="method">' + esc(methodLabel(liveItem.method || st.method)) + '</span></span>' +
      '<span><span>' + "丢包 " + fmtMs(st.loss) + '%</span> <button class="xbtn" data-del="' + t.id + '" title="删除">×</button></span></div>' +
      '<div class="val">' + fmtMs(cur) + '<small>ms</small></div>' +
      '<div class="meta">min/avg/max ' + fmtMs(st.min) + " / " + fmtMs(st.avg) + " / " + fmtMs(st.max) + " · 抖动 " + fmtMs(st.jitter) + " · P50/P95/P99 " + fmtMs(st.p50) + "/" + fmtMs(st.p95) + "/" + fmtMs(st.p99) + "</div></div>";
  }).join("");
  box.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", ev => { ev.stopPropagation(); delTarget(btn.getAttribute("data-del")); });
    btn.addEventListener("mousedown", ev => ev.stopPropagation());
  });
  box.querySelectorAll(".card[data-id]").forEach(card => {
    card.addEventListener("dragstart", ev => {
      cardDrag = card.getAttribute("data-id");
      card.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", cardDrag);
    });
    card.addEventListener("dragend", () => {
      cardDrag = null;
      box.querySelectorAll(".card").forEach(c => c.classList.remove("dragging","drag-over"));
    });
    card.addEventListener("dragover", ev => {
      ev.preventDefault();
      ev.dataTransfer.dropEffect = "move";
      box.querySelectorAll(".card").forEach(c => c.classList.toggle("drag-over", c === card && cardDrag && cardDrag !== card.getAttribute("data-id")));
    });
    card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
    card.addEventListener("drop", ev => {
      ev.preventDefault();
      const toId = card.getAttribute("data-id");
      const fromId = ev.dataTransfer.getData("text/plain") || cardDrag;
      cardDrag = null;
      box.querySelectorAll(".card").forEach(c => c.classList.remove("dragging","drag-over"));
      reorderTargets(fromId, toId);
    });
  });
}

async function reorderTargets(fromId, toId){
  if (!data || !data.targets || !fromId || !toId || fromId === toId) return;
  const list = data.targets.slice();
  const from = list.findIndex(t => t.id === fromId);
  const to = list.findIndex(t => t.id === toId);
  if (from < 0 || to < 0) return;
  const item = list.splice(from, 1)[0];
  list.splice(to, 0, item);
  data.targets = list;
  renderCards();
  refreshSeriesUi();
  await api("action=reorder&ids=" + encodeURIComponent(list.map(t => t.id).join(",")));
}


function seriesCountText(){
  const targets = (data && data.targets) || [];
  const vis = visibleTargets().length;
  const el = document.getElementById("seriesCount");
  if (el) el.textContent = targets.length ? (vis + "/" + targets.length) : "";
}
function renderSeriesFilters(){

async function api(qs){
  if (!window.parent || typeof window.parent.wanLatencyApi !== "function")
    throw new Error("请从已登录的 LuCI 公网延迟页面访问");
  return window.parent.wanLatencyApi(qs);
}

async function addTarget(name, host, region){
  document.getElementById("addErr").textContent = "";
  const q = "action=add&name=" + encodeURIComponent(name || "") + "&host=" + encodeURIComponent(host || "") + "&region=" + encodeURIComponent(region || "auto");
  const r = await api(q);
  if (!r.ok) { document.getElementById("addErr").textContent = r.error || "添加失败"; return; }
  document.getElementById("newName").value = "";
  document.getElementById("newHost").value = "";
  await loadQuery();
}

async function delTarget(id){
  await api("action=delete&id=" + encodeURIComponent(id));
  await loadQuery();
}

function updateOverview(){
  const targets=currentTargets(), stats=(data&&data.stats)||{}, latest=((data&&data.latest&&data.latest.items)||[]);
  const latestMap={}; latest.forEach(item=>{latestMap[item.id]=item;});
  const current=[], history=[], domestic=[], foreign=[]; let bad=0;
  const groups={domestic:{attempts:0,failed:0},foreign:{attempts:0,failed:0}};
  targets.forEach(t=>{
    const st=stats[t.id]||{}, cur=latestMap[t.id]&&latestMap[t.id].rtt;
    if(st.avg!=null) history.push(Number(st.avg));
    const group=groups[t.region];
    if(group && Number(st.attempts)>0){group.attempts+=Number(st.attempts);group.failed+=Number(st.failed)||0;}
    if(cur==null){bad++;return;}
    const value=Number(cur); current.push(value);
    if(t.region==='foreign') foreign.push(value); else if(t.region==='domestic') domestic.push(value);
  });
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const currentMean=avg(current), historyMean=avg(history);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;}; const ms=v=>v==null?'--':v.toFixed(1)+' ms';
  set('heroAvg',ms(currentMean)); set('heroOnline',current.length); set('heroBad',bad);
  set('ovAvg',ms(historyMean!=null?historyMean:currentMean)); set('ovCur',ms(currentMean)); set('ovDomestic',ms(avg(domestic))); set('ovForeign',ms(avg(foreign)));
  [['domestic','Domestic'],['foreign','Foreign']].forEach(([region,key])=>{
    const g=groups[region], value=g.attempts?(100*g.failed/g.attempts).toFixed(1)+'%':'--';
    set('hero'+key+'Loss',value); set('ov'+key+'Loss',value);
    set('ov'+key+'LossDetail',g.attempts?'失败 '+g.failed+' / 探测 '+g.attempts+' 次':'所选历史范围暂无采样');
  });
  const stale=!(data&&data.latest&&data.latest.ts)||Math.floor(Date.now()/1000)-data.latest.ts>Math.max(20,pingInterval*3); set('ovLast',stale?'异常':'正常'); set('ovLastDetail',data&&data.latest&&data.latest.ts?'最近更新 '+fmtTime(data.latest.ts):'等待数据');
  const health=document.getElementById('healthTitle'), icon=document.getElementById('healthIcon'); if(health)health.textContent=stale?'采集异常':'网络正常'; if(icon){icon.textContent=stale?'!':'✓';icon.style.color=stale?'#e35353':'#27a55d';icon.style.borderColor=stale?'#e35353':'#27a55d';}
}

let carrierFilter = 'all';
let carrierPanel = null;
if (typeof createCarrierPanel === 'function' && document.createElement) {
  carrierPanel = createCarrierPanel((mode,value) => api('action=carrier_'+mode+(value!=null?'&value='+encodeURIComponent(value):'')), value => { carrierFilter=value; loadQuery(); });
  document.getElementById('settingsSection').insertAdjacentElement('beforebegin',carrierPanel.node);
  carrierPanel.refresh();
}
let realtimeInFlight = false;
let queryGeneration = 0;
async function loadRealtime(){
  if (realtimeInFlight) return;
  realtimeInFlight = true;
  try {
    const results=await Promise.all([api('action=latest'),api('action=targets')]);
    const latest=results[0]||{}, targetResult=results[1]||{};
    data=data||{};
    if(!data.latest || Number(latest.ts)>=Number(data.latest.ts||0)) data.latest=latest;
    if(targetResult.ok&&Array.isArray(targetResult.targets)) data.targets=targetResult.targets;
    renderCards(); updateOverview(); updatePresetButtons(); updatePageSub();
    if(carrierPanel) carrierPanel.refresh();
    const status=document.getElementById('statusLine');
    if(status&&status.textContent==='正在加载…'&&latest.ts) status.textContent='实时数据已加载，正在读取历史曲线…';
  } catch(err) {
    const status=document.getElementById('statusLine');
    if(status&&status.textContent==='正在加载…') status.textContent='实时数据加载失败：'+String(err&&err.message||err);
  } finally { realtimeInFlight=false; }
}

async function loadSettings(){ const r=await api('action=settings'); if(!r||!r.ok)return; const map={pingInterval:r.interval,probeTimeout:r.timeout,latencyThreshold:r.latency_threshold_ms,retainDays:r.retain_days}; Object.keys(map).forEach(id=>{const e=document.getElementById(id);if(e&&map[id]!=null)e.value=map[id];}); pingInterval=Number(r.interval)||pingInterval; schedulePoll(); }
async function saveSetting(name,value){ const r=await api('action=setting&name='+encodeURIComponent(name)+'&value='+encodeURIComponent(value)); if(!r||!r.ok) return; if(name==='interval'){pingInterval=Number(r.value)||pingInterval;schedulePoll();} await loadQuery(); }

async function loadQuery(){
  const requestGeneration = ++queryGeneration;
  const now = Math.floor(Date.now()/1000);
  let from, to;
  if (custom) {
    from = fromLocalInput(document.getElementById("fromTime").value);
    to = fromLocalInput(document.getElementById("toTime").value);
    if (!from || !to) return;
    if (to < from) { const x=from; from=to; to=x; }
  } else {
    to = now; from = now - rangeSec;
  }
  let response;
  try { response = await api("action=query&from=" + from + "&to=" + to + "&carrier=" + carrierFilter); }
  catch(err) {
    if (requestGeneration !== queryGeneration) return;
    document.getElementById("statusLine").textContent = '历史数据加载失败：' + String(err&&err.message||err);
    return;
  }
  if (requestGeneration !== queryGeneration) return;
  if (!response || !response.ok) {
    document.getElementById("statusLine").textContent = '历史数据加载失败';
    return;
  }
  if(data && data.latest && Number(data.latest.ts)>Number((response.latest||{}).ts||0)) response.latest=data.latest;
  data = response;
  if(carrierPanel) carrierPanel.report(data.carriers||[], data.targets||[]);
  renderCards();
  updateOverview();
  renderSeriesFilters();
  renderLegend();
  updatePresetButtons();
  const latest = data.latest || {};
  const stale = !latest.ts || (now - latest.ts > Math.max(20, pingInterval * 3));
  const iv = data.interval || (data.meta && data.meta.interval) || pingInterval;
  if (iv && Number(iv) !== pingInterval) {
    pingInterval = Number(iv);
    const sel = document.getElementById("pingInterval");
    if (sel && sel.value !== String(pingInterval)) sel.value = String(pingInterval);
    schedulePoll();
  }
  document.getElementById("statusLine").innerHTML = stale
    ? '<span class="stale">采集似乎已停止</span> · 原始点 ' + (data.count||0) + " · 步长 " + data.step + "s"
    : "采集正常 · " + ((data.targets||[]).length) + " 个目标 · 每 " + pingInterval + " 秒探测 · 原始点 " + (data.count||0) + " · 显示步长 " + data.step + "s · " + fmtTime(from) + " 至 " + fmtTime(to);
  if (data.meta) {
    const mb = ((data.meta.bytes||0)/1024/1024).toFixed(2);
    document.getElementById("storeLine").textContent = "已存 " + (data.meta.samples||0) + " 点 / " + mb + " MB，保留 " + (data.meta.retain_days || 366) + " 天";
  }
  updatePageSub();
  if (!custom) {
    document.getElementById("fromTime").value = toLocalInput(from);
    document.getElementById("toTime").value = toLocalInput(to);
  }
  draw();
}

function geometry(){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w*dpr) || canvas.height !== Math.floor(h*dpr)) {
    canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h, pad:{l:48,r:16,t:18,b:32}};
}
function yMax(){
  let m = 10;
  const series = (data && data.series) || {};
  Object.keys(series).forEach(id => {
    if (hidden[id]) return;
    (series[id].max || series[id].avg || []).forEach(v => { if (v!=null && v>m) m=v; });
  });
  return Math.ceil(m / 10) * 10;
}
function draw(){
  const {ctx,w,h,pad} = geometry();
  ctx.clearRect(0,0,w,h);
  if (!data || !data.t || !data.t.length) {
    ctx.fillStyle = "#84909b";
    ctx.font = "14px sans-serif";
    ctx.fillText("暂无曲线。添加目标后会在这里画出来", 24, h/2);
    return;
  }
  if (!visibleTargets().length) {
    ctx.fillStyle = "#8ea0b8";
    ctx.font = "14px sans-serif";
    ctx.fillText("已隐藏全部曲线，点上方彩色标签勾选要看的项目", 24, h/2);
    return;
  }
  const t0 = data.t[0], t1 = data.t[data.t.length-1] || t0+1;
  const maxv = yMax();
  const x = ts => pad.l + (ts-t0) / Math.max(1,t1-t0) * (w-pad.l-pad.r);
  const y = v => pad.t + (1 - v/maxv) * (h-pad.t-pad.b);
  ctx.strokeStyle = "#e4ecef"; ctx.lineWidth = 1;
  ctx.fillStyle = "#8ea0b8"; ctx.font = "11px sans-serif";
  for (let i=0;i<=4;i++){
    const v = maxv * i / 4, yy = y(v);
    ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(w-pad.r, yy); ctx.stroke();
    ctx.fillText(v.toFixed(0) + "ms", 8, yy+4);
  }
  for (let i=0;i<=6;i++){
    const ts = t0 + (t1-t0)*i/6;
    ctx.fillText(fmtTime(ts).slice(5,16), x(ts)-28, h-10);
  }
  function band(minA, maxA, color){
    if (!minA || !maxA) return;
    ctx.beginPath();
    let started=false;
    for (let i=0;i<data.t.length;i++){
      if (minA[i]==null || maxA[i]==null){ started=false; continue; }
      const xx=x(data.t[i]), yy=y(maxA[i]);
      if (!started){ ctx.moveTo(xx,yy); started=true; } else ctx.lineTo(xx,yy);
    }
    for (let i=data.t.length-1;i>=0;i--){
      if (minA[i]==null || maxA[i]==null) continue;
      ctx.lineTo(x(data.t[i]), y(minA[i]));
    }
    ctx.closePath();
    ctx.fillStyle = color + "22";
    ctx.fill();
  }
  function line(arr, color){
    ctx.beginPath();
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin="round";
    let started=false;
    for (let i=0;i<data.t.length;i++){
      const v = arr[i];
      if (v==null){ started=false; continue; }
      const xx=x(data.t[i]), yy=y(v);
      if (!started){ ctx.moveTo(xx,yy); started=true; } else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
  }
  (data.targets||[]).forEach(t => {
    if (hidden[t.id]) return;
    const s = (data.series||{})[t.id] || {};
    band(s.min, s.max, t.color);
    line(s.avg, t.color);
  });
  if (hoverX!=null){
    const ts = t0 + (hoverX-pad.l)/Math.max(1,w-pad.l-pad.r)*(t1-t0);
    let idx=0, best=1e18;
    for (let i=0;i<data.t.length;i++){
      const d=Math.abs(data.t[i]-ts); if (d<best){best=d; idx=i;}
    }
    const xx=x(data.t[idx]);
    ctx.strokeStyle="#8ea0b8"; ctx.beginPath(); ctx.moveTo(xx,pad.t); ctx.lineTo(xx,h-pad.b); ctx.stroke();
    tip.style.display="block";
    const shown = visibleTargets();
    tip.innerHTML = fmtTime(data.t[idx]) + (shown.length ? shown : (data.targets||[])).map(t => {
      const s = (data.series||{})[t.id] || {};
      return "<br>" + esc(t.name) + " " + fmtMs(s.avg && s.avg[idx]) + " ms";
    }).join("");
  }
  if (drag){
    const a=Math.min(drag.x0, drag.x1), b=Math.max(drag.x0, drag.x1);
    ctx.fillStyle="rgba(77,127,214,.18)";
    ctx.fillRect(a, pad.t, b-a, h-pad.t-pad.b);
  }
}

function canvasX(ev){ return ev.clientX - canvas.getBoundingClientRect().left; }
canvas.addEventListener("mousemove", ev => {
  hoverX = canvasX(ev);
  tip.style.left = (ev.clientX+14)+"px";
  tip.style.top = (ev.clientY+14)+"px";
  if (drag) drag.x1 = hoverX;
  draw();
});
canvas.addEventListener("mouseleave", () => { hoverX=null; tip.style.display="none"; draw(); });
canvas.addEventListener("mousedown", ev => { drag = {x0: canvasX(ev), x1: canvasX(ev)}; });
window.addEventListener("mouseup", () => {
  if (!drag || !data || !data.t || !data.t.length){ drag=null; return; }
  const w=canvas.clientWidth, padL=48, padR=16;
  const t0=data.t[0], t1=data.t[data.t.length-1];
  const toTs = x => t0 + (x-padL)/Math.max(1,w-padL-padR)*(t1-t0);
  const a=Math.min(drag.x0,drag.x1), b=Math.max(drag.x0,drag.x1);
  drag=null;
  if (b-a<12) return;
  custom = true; live=false;
  document.getElementById("liveBtn").classList.remove("active");
  document.querySelectorAll(".btn[data-range]").forEach(btn=>btn.classList.remove("active"));
  document.getElementById("fromTime").value = toLocalInput(toTs(a));
  document.getElementById("toTime").value = toLocalInput(toTs(b));
  loadQuery();
});
canvas.addEventListener("dblclick", () => {
  custom=false; live=true; rangeSec=3600;
  document.querySelectorAll(".btn[data-range]").forEach(btn=>btn.classList.toggle("active", btn.dataset.range==="3600"));
  document.getElementById("liveBtn").classList.add("active");
  loadQuery();
});
canvas.addEventListener("wheel", ev => {
  if (!data || !data.t || !data.t.length) return;
  ev.preventDefault();
  custom=true; live=false;
  const span = data.to - data.from;
  const next = ev.deltaY>0 ? span*1.4 : span/1.4;
  const mid = (data.from+data.to)/2;
  const half = Math.max(60, Math.min(366*86400, next))/2;
  document.getElementById("fromTime").value = toLocalInput(mid-half);
  document.getElementById("toTime").value = toLocalInput(mid+half);
  document.getElementById("liveBtn").classList.remove("active");
  loadQuery();
}, {passive:false});

document.querySelectorAll(".btn[data-range]").forEach(btn => {
  btn.addEventListener("click", () => {
    rangeSec = parseInt(btn.dataset.range,10);
    custom=false; live = rangeSec<=3600;
    document.querySelectorAll(".btn[data-range]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("liveBtn").classList.toggle("active", live);
    loadQuery();
  });
});
document.getElementById("applyCustom").addEventListener("click", () => {
  custom=true; live=false;
  document.getElementById("liveBtn").classList.remove("active");
  document.querySelectorAll(".btn[data-range]").forEach(b=>b.classList.remove("active"));
  loadQuery();
});
document.getElementById("liveBtn").addEventListener("click", () => {
  live = !live; custom=false;
  document.getElementById("liveBtn").classList.toggle("active", live);
  if (live) loadQuery();
});
document.getElementById("exportCsv").addEventListener("click", () => {
  if (!data || !data.t) return;
  const targets = visibleTargets();
  const rows = [["time", "carrier_filter"].concat(targets.map(t => t.name))];
  data.t.forEach((ts, i) => rows.push([fmtTime(ts), carrierFilter].concat(targets.map(t => {
    const s = (data.series || {})[t.id] || {};
    return s.avg && s.avg[i] != null ? s.avg[i] : "";
  }))));
  const csv = rows.map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"}));
  a.download = "wan-latency-carrier-" + carrierFilter + "-" + Date.now() + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

document.getElementById("seriesAll").addEventListener("click", () => {
  hidden = {};
  saveHidden();
  refreshSeriesUi();
});
document.getElementById("seriesNone").addEventListener("click", () => {
  ((data && data.targets) || []).forEach(t => { hidden[t.id] = true; });
  saveHidden();
  refreshSeriesUi();
});
document.getElementById("seriesInvert").addEventListener("click", () => {
  ((data && data.targets) || []).forEach(t => { hidden[t.id] = !hidden[t.id]; });
  saveHidden();
  refreshSeriesUi();
});
document.getElementById("addBtn").addEventListener("click", () => {
  addTarget(document.getElementById("newName").value, document.getElementById("newHost").value, document.getElementById("newRegion").value);
});
document.getElementById("newHost").addEventListener("keydown", ev => {
  if (ev.key === "Enter") addTarget(document.getElementById("newName").value, document.getElementById("newHost").value, document.getElementById("newRegion").value);
});
PRESETS.forEach(p => {
  document.getElementById("p_" + p.id).addEventListener("click", () => {
    if (document.getElementById("p_" + p.id).classList.contains("disabled")) return;
    addTarget(p.name, p.host, p.region);
  });
});
document.querySelectorAll(".navitem[data-target]").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = document.getElementById(btn.dataset.target);
    if (target) target.scrollIntoView({behavior:"smooth", block:"start"});
    document.querySelectorAll(".navitem").forEach(item => item.classList.toggle("active", item === btn));
  });
});
window.addEventListener("resize", draw);

let deviceName = "当前设备";
async function loadDevice(){
  try {
    const device = await api("action=device");
    if (device && device.ok && typeof device.hostname === "string" && device.hostname.trim())
      deviceName = device.hostname.trim();
  } catch (_) { /* Keep the generic device label when identification is unavailable. */ }
  updatePageSub();
}

function updatePageSub(){
  const sel = document.getElementById("pingInterval");
  if (sel && sel.value) pingInterval = Number(sel.value) || pingInterval;
  const store = (data && (data.storage_label || (data.meta && data.meta.storage_label))) || "路由器本地存储";
  const el = document.getElementById("pageSub") || document.querySelector("h1 + .sub");
  if (el) el.textContent = "从 " + deviceName + " 的 WAN 接口探测。每 " + pingInterval + " 秒一个点，数据保存在" + store + "上。目标可任意添加，可一键添加国内外 DNS 与 Steam 等预设目标。";
}
function schedulePoll(){
  if (pollTimer) clearInterval(pollTimer);
  const ms = Math.max(2000, Math.min(5000, pingInterval * 1000));
  pollTimer = setInterval(() => { loadRealtime(); if (live) loadQuery(); }, ms);
}
document.getElementById("pingInterval").addEventListener("change", async () => {
  const v = document.getElementById("pingInterval").value;
  const r = await api("action=interval&value=" + encodeURIComponent(v));
  if (r && r.ok) {
    pingInterval = r.interval;
    updatePageSub();
    schedulePoll();
    loadQuery();
  }
});
['probeTimeout','latencyThreshold','retainDays'].forEach(id=>{ const e=document.getElementById(id); if(e)e.addEventListener('change',()=>saveSetting({probeTimeout:'timeout',latencyThreshold:'latency_threshold_ms',retainDays:'retain_days'}[id],e.value)); });
updatePageSub();
loadDevice();
schedulePoll();
loadRealtime();
loadSettings().catch(err => { document.getElementById('statusLine').textContent = '设置读取失败：' + String(err && err.message || err); });
loadQuery();
</script>
