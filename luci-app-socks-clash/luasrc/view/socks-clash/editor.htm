<%# SocksClash Config Editor Page -%>

    <%+header%>

        <style>
            .sc-editor-container {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                max-width: 1400px;
                margin: 0 auto;
                padding: 24px;
            }

            .sc-editor-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 24px;
                flex-wrap: wrap;
                gap: 16px;
            }

            .sc-editor-title {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .sc-editor-icon {
                width: 48px;
                height: 48px;
                background: linear-gradient(135deg, #6366f1, #4f46e5);
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
                color: white;
            }

            .sc-editor-title h2 {
                font-size: 24px;
                font-weight: 700;
                color: #1e293b;
                margin: 0;
            }

            .sc-editor-title p {
                font-size: 14px;
                color: #64748b;
                margin: 4px 0 0 0;
            }

            .sc-editor-controls {
                display: flex;
                gap: 12px;
            }

            .sc-editor-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 10px 20px;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .sc-editor-btn-primary {
                background: linear-gradient(135deg, #10b981, #059669);
                color: white;
            }

            .sc-editor-btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            }

            .sc-editor-btn-secondary {
                background: linear-gradient(135deg, #6366f1, #4f46e5);
                color: white;
            }

            .sc-editor-btn-secondary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            }

            .sc-editor-btn-danger {
                background: linear-gradient(135deg, #ef4444, #dc2626);
                color: white;
            }

            .sc-editor-btn-outline {
                background: white;
                color: #6366f1;
                border: 2px solid #6366f1;
            }

            .sc-editor-btn-outline:hover {
                background: #6366f1;
                color: white;
            }

            .sc-editor-card {
                background: white;
                border-radius: 12px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
                overflow: hidden;
                margin-bottom: 20px;
            }

            .sc-editor-card-header {
                padding: 16px 24px;
                background: #f8fafc;
                border-bottom: 1px solid #e2e8f0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .sc-editor-card-header h3 {
                margin: 0;
                font-size: 16px;
                font-weight: 600;
                color: #1e293b;
            }

            .sc-editor-tabs {
                display: flex;
                gap: 8px;
            }

            .sc-editor-tab {
                padding: 8px 16px;
                border: none;
                background: transparent;
                color: #64748b;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                border-radius: 6px;
                transition: all 0.2s;
            }

            .sc-editor-tab:hover {
                background: #e2e8f0;
            }

            .sc-editor-tab.active {
                background: #6366f1;
                color: white;
            }

            .sc-editor-content {
                padding: 0;
            }

            .sc-editor-textarea {
                width: 100%;
                height: 600px;
                padding: 16px;
                border: none;
                font-family: 'Monaco', 'Consolas', 'Courier New', monospace;
                font-size: 13px;
                line-height: 1.6;
                background: #0f172a;
                color: #e2e8f0;
                resize: vertical;
                outline: none;
            }

            .sc-editor-textarea:focus {
                outline: none;
            }

            .sc-editor-footer {
                padding: 16px 24px;
                background: #f8fafc;
                border-top: 1px solid #e2e8f0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .sc-editor-status {
                font-size: 13px;
                color: #64748b;
            }

            .sc-editor-status.success {
                color: #10b981;
            }

            .sc-editor-status.error {
                color: #ef4444;
            }

            .sc-toast {
                position: fixed;
                bottom: 20px;
                right: 20px;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                z-index: 1000;
                opacity: 0;
                transform: translateY(20px);
                transition: all 0.3s;
            }

            .sc-toast.show {
                opacity: 1;
                transform: translateY(0);
            }

            .sc-toast.success {
                background: #10b981;
                color: white;
            }

            .sc-toast.error {
                background: #ef4444;
                color: white;
            }

            .sc-file-select {
                padding: 8px 12px;
                border: 1px solid #e2e8f0;
                border-radius: 6px;
                font-size: 14px;
                background: white;
                cursor: pointer;
                min-width: 200px;
            }
        </style>

        <div class="sc-editor-container">
            <div class="sc-editor-header">
                <div class="sc-editor-title">
                    <div class="sc-editor-icon">📝</div>
                    <div>
                        <h2>配置文件编辑器</h2>
                        <p>直接编辑 Clash 配置文件</p>
                    </div>
                </div>
                <div class="sc-editor-controls">
                    <button class="sc-editor-btn sc-editor-btn-outline" onclick="reloadConfig()">
                        <span>🔄</span> 重新加载
                    </button>
                    <button class="sc-editor-btn sc-editor-btn-primary" onclick="saveConfig()">
                        <span>💾</span> 保存配置
                    </button>
                    <button class="sc-editor-btn sc-editor-btn-secondary" onclick="saveAndRestart()">
                        <span>🚀</span> 保存并重启
                    </button>
                </div>
            </div>

            <div class="sc-editor-card">
                <div class="sc-editor-card-header">
                    <h3>配置文件</h3>
                    <select class="sc-file-select" id="config-file-select" onchange="loadSelectedFile()">
                        <option value="config.yaml">config.yaml (主配置)</option>
                    </select>
                </div>
                <div class="sc-editor-content">
                    <textarea class="sc-editor-textarea" id="config-editor" placeholder="加载配置文件中..."></textarea>
                </div>
                <div class="sc-editor-footer">
                    <span class="sc-editor-status" id="editor-status">就绪</span>
                    <div>
                        <span style="font-size: 13px; color: #64748b;">
                            提示: 修改配置后需要重启服务才能生效
                        </span>
                    </div>
                </div>
            </div>

            <div class="sc-editor-card">
                <div class="sc-editor-card-header">
                    <h3>快速操作</h3>
                </div>
                <div style="padding: 20px; display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="sc-editor-btn sc-editor-btn-outline" onclick="insertTemplate('proxy')">
                        <span>➕</span> 插入代理模板
                    </button>
                    <button class="sc-editor-btn sc-editor-btn-outline" onclick="insertTemplate('rule')">
                        <span>📋</span> 插入规则模板
                    </button>
                    <button class="sc-editor-btn sc-editor-btn-outline" onclick="formatYaml()">
                        <span>✨</span> 格式化 YAML
                    </button>
                    <button class="sc-editor-btn sc-editor-btn-danger" onclick="resetConfig()">
                        <span>🔄</span> 重置为默认
                    </button>
                </div>
            </div>
        </div>

        <div id="toast" class="sc-toast"></div>

        <script>
            var currentFile = 'config.yaml';
            var configApiUrl = '<%=luci.dispatcher.build_url("admin/services/socks-clash/get_config")%>';
            var saveApiUrl = '<%=luci.dispatcher.build_url("admin/services/socks-clash/save_config")%>';
            var resetApiUrl = '<%=luci.dispatcher.build_url("admin/services/socks-clash/reset_config")%>';

            function toast(msg, type) {
                var t = document.getElementById('toast');
                t.textContent = msg;
                t.className = 'sc-toast ' + (type || 'success') + ' show';
                setTimeout(function () { t.classList.remove('show'); }, 3000);
            }

            function setStatus(msg, type) {
                var status = document.getElementById('editor-status');
                status.textContent = msg;
                status.className = 'sc-editor-status ' + (type || '');
            }

            function ajaxGet(url, callback) {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.setRequestHeader('Accept', 'application/json');
                xhr.onreadystatechange = function () {
                    if (xhr.readyState === 4) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(data);
                        } catch (e) {
                            callback(null);
                        }
                    }
                };
                xhr.send();
            }

            function ajaxPost(url, params, callback) {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', url, true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.setRequestHeader('Accept', 'application/json');
                xhr.onreadystatechange = function () {
                    if (xhr.readyState === 4) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(data);
                        } catch (e) {
                            callback(null);
                        }
                    }
                };
                var body = Object.keys(params).map(function (key) {
                    return encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
                }).join('&');
                xhr.send(body);
            }

            function loadConfig() {
                setStatus('加载中...');
                ajaxGet(configApiUrl, function (data) {
                    if (data && data.content !== undefined) {
                        document.getElementById('config-editor').value = data.content;
                        setStatus('已加载', 'success');

                        // 更新文件列表
                        if (data.files && data.files.length > 0) {
                            var select = document.getElementById('config-file-select');
                            select.innerHTML = '';
                            data.files.forEach(function (file) {
                                var opt = document.createElement('option');
                                opt.value = file;
                                opt.textContent = file + (file === 'config.yaml' ? ' (主配置)' : '');
                                select.appendChild(opt);
                            });
                        }
                    } else if (data && data.content === '') {
                        // 空文件也是正常的
                        document.getElementById('config-editor').value = '';
                        setStatus('配置文件为空，请编辑或重置', 'success');
                    } else {
                        document.getElementById('config-editor').value = '# 无法加载配置文件\n# 请点击"重置为默认"创建新配置';
                        setStatus('配置文件不存在', 'error');
                    }
                });
            }

            function loadSelectedFile() {
                currentFile = document.getElementById('config-file-select').value;
                setStatus('加载中...');
                ajaxGet(configApiUrl + '?file=' + encodeURIComponent(currentFile), function (data) {
                    if (data && data.content !== undefined) {
                        document.getElementById('config-editor').value = data.content;
                        setStatus('已加载: ' + currentFile, 'success');
                    } else {
                        setStatus('加载失败', 'error');
                    }
                });
            }

            function reloadConfig() {
                loadSelectedFile();
                toast('配置已重新加载');
            }

            function saveConfig() {
                var content = document.getElementById('config-editor').value;
                setStatus('保存中...');

                ajaxPost(saveApiUrl, { file: currentFile, content: content }, function (data) {
                    if (data && data.success) {
                        setStatus('已保存', 'success');
                        toast('配置已保存');
                    } else {
                        setStatus('保存失败: ' + (data && data.message || '未知错误'), 'error');
                        toast('保存失败', 'error');
                    }
                });
            }

            function saveAndRestart() {
                var content = document.getElementById('config-editor').value;
                setStatus('保存并重启中...');

                ajaxPost(saveApiUrl, { file: currentFile, content: content, restart: '1' }, function (data) {
                    if (data && data.success) {
                        setStatus('已保存并重启', 'success');
                        toast('配置已保存，服务已重启');
                    } else {
                        setStatus('操作失败', 'error');
                        toast('操作失败', 'error');
                    }
                });
            }

            function insertTemplate(type) {
                var editor = document.getElementById('config-editor');
                var template = '';

                if (type === 'proxy') {
                    template = '\n# 代理服务器示例\n' +
                        '  - name: "示例节点"\n' +
                        '    type: ss\n' +
                        '    server: example.com\n' +
                        '    port: 443\n' +
                        '    cipher: aes-256-gcm\n' +
                        '    password: "your-password"\n';
                } else if (type === 'rule') {
                    template = '\n# 规则示例\n' +
                        '  - DOMAIN-SUFFIX,google.com,PROXY\n' +
                        '  - DOMAIN-KEYWORD,youtube,PROXY\n' +
                        '  - IP-CIDR,8.8.8.8/32,PROXY\n' +
                        '  - GEOIP,CN,DIRECT\n';
                }

                var pos = editor.selectionStart;
                var before = editor.value.substring(0, pos);
                var after = editor.value.substring(pos);
                editor.value = before + template + after;
                editor.focus();
                toast('模板已插入');
            }

            function formatYaml() {
                toast('YAML 格式化功能开发中');
            }

            function resetConfig() {
                if (confirm('确定要重置配置文件吗？这将覆盖当前内容！')) {
                    ajaxGet(resetApiUrl, function (data) {
                        if (data && data.success) {
                            loadConfig();
                            toast('配置已重置');
                        } else {
                            toast('重置失败', 'error');
                        }
                    });
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                loadConfig();
            });
        </script>

        <%+footer%>
