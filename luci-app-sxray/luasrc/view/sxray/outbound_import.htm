<div class="cbi-section-node">
	<div class="cbi-section">
		<h3><%:Import Configuration%></h3>
		<div class="cbi-section-descr"><%:Import configuration from URI list, Xray JSON, or Sing-box JSON format%></div>
		
		<div class="cbi-value">
			<label class="cbi-value-title"><%:Import Source%></label>
			<div class="cbi-value-field">
				<select id="import_source" class="cbi-input-select">
					<option value="manual"><%:Manual Input%></option>
					<option value="url"><%:URL Download%></option>
				</select>
			</div>
		</div>

		<div class="cbi-value" id="import_manual_div">
			<label class="cbi-value-title"><%:Configuration Content%></label>
			<div class="cbi-value-field">
				<textarea id="import_content" class="cbi-input-textarea" style="width: 100%; min-height: 200px;" placeholder="<%:Paste configuration content here (URI list, Xray JSON, or Sing-box JSON)%>"></textarea>
			</div>
		</div>

		<div class="cbi-value" id="import_url_div" style="display:none;">
			<label class="cbi-value-title"><%:Configuration URL%></label>
			<div class="cbi-value-field">
				<input type="text" id="import_url" class="cbi-input-text" style="width: 100%;" placeholder="<%:Enter configuration URL%>" />
			</div>
		</div>

		<div class="cbi-value">
			<label class="cbi-value-title"><%:Core Type%></label>
			<div class="cbi-value-field">
				<select id="import_core_type" class="cbi-input-select">
					<option value="auto"><%:Auto Detect%></option>
					<option value="xray">Xray</option>
					<option value="sing-box">Sing-Box</option>
				</select>
			</div>
		</div>

		<div class="cbi-value">
			<div class="cbi-value-field" style="padding-left: 0;">
				<input type="button" class="btn cbi-button cbi-button-action" id="import_parse_btn" value="<%:Parse Configuration%>" />
				<input type="button" class="btn cbi-button cbi-button-save" id="import_save_btn" value="<%:Save Configuration%>" style="display:none;" />
				<span id="import_status" style="margin-left: 10px;"></span>
			</div>
		</div>

		<div class="cbi-value" id="import_preview_div" style="display:none;">
			<label class="cbi-value-title"><%:Configuration Preview%></label>
			<div class="cbi-value-field">
				<div id="import_preview" style="border: 1px solid #ccc; padding: 10px; max-height: 400px; overflow: auto; background: #f5f5f5; border-radius: 3px;"></div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
(function() {
	var import_source = document.getElementById('import_source');
	var import_manual_div = document.getElementById('import_manual_div');
	var import_url_div = document.getElementById('import_url_div');
	var import_content = document.getElementById('import_content');
	var import_url = document.getElementById('import_url');
	var import_core_type = document.getElementById('import_core_type');
	var import_parse_btn = document.getElementById('import_parse_btn');
	var import_save_btn = document.getElementById('import_save_btn');
	var import_status = document.getElementById('import_status');
	var import_preview_div = document.getElementById('import_preview_div');
	var import_preview = document.getElementById('import_preview');

	var parsed_data = null;

	import_source.addEventListener('change', function() {
		if (this.value === 'manual') {
			import_manual_div.style.display = '';
			import_url_div.style.display = 'none';
		} else {
			import_manual_div.style.display = 'none';
			import_url_div.style.display = '';
		}
	});

	import_parse_btn.addEventListener('click', function() {
		var source = import_source.value;
		var content = '';
		var core_type = import_core_type.value;

		if (source === 'manual') {
			content = import_content.value.trim();
			if (!content) {
				import_status.innerHTML = '<span style="color: red;"><%:Please provide configuration content%></span>';
				return;
			}
			parseConfiguration(content, core_type);
		} else {
			content = import_url.value.trim();
			if (!content) {
				import_status.innerHTML = '<span style="color: red;"><%:Please provide configuration URL%></span>';
				return;
			}

			// Check if input is a URI (vmess://, vless://, etc.) instead of HTTP URL
			if (content.match(/^(vmess|vless|trojan|ss|ssr|hysteria|hysteria2|hy2|tuic):\/\//i)) {
				// Auto-switch to manual input mode and parse the URI
				import_source.value = 'manual';
				import_manual_div.style.display = '';
				import_url_div.style.display = 'none';
				import_content.value = content;
				import_url.value = '';
				import_status.innerHTML = '<span style="color: orange;"><%:Detected URI format, switched to manual input mode%></span>';
				parseConfiguration(content, core_type);
				return;
			}

			// Validate HTTP/HTTPS URL
			if (!content.match(/^https?:\/\//i)) {
				import_status.innerHTML = '<span style="color: red;"><%:Invalid URL format. Please enter HTTP/HTTPS URL for download, or switch to manual input for URI%></span>';
				return;
			}

			import_status.innerHTML = '<span style="color: orange;"><%:Downloading configuration...%></span>';
			(new XHR()).get('<%=luci.dispatcher.build_url("admin/services/sxray/import/fetch")%>', {
				url: content
			}, function(x, data) {
				if (x && x.status === 200 && data && data.success) {
					import_content.value = data.content;
					parseConfiguration(data.content, core_type);
				} else {
					import_status.innerHTML = '<span style="color: red;">' + (data && data.error ? data.error : '<%:Failed to download configuration%>') + '</span>';
				}
			});
		}
	});

	function parseConfiguration(content, core_type) {
		import_status.innerHTML = '<span style="color: orange;"><%:Parsing configuration...%></span>';

		(new XHR()).post('<%=luci.dispatcher.build_url("admin/services/sxray/import/parse")%>', {
			content: content,
			format: 'auto',
			core_type: core_type
		}, function(x, data) {
			if (x && x.status === 200 && data && data.success) {
				parsed_data = data.data;
				import_status.innerHTML = '<span style="color: green;"><%:Configuration parsed successfully%></span>';
				import_save_btn.style.display = '';
				import_preview_div.style.display = '';

				var preview_html = '<div style="font-family: monospace; font-size: 12px;">';
				if (data.format === 'uri_list') {
					preview_html += '<strong><%:Format%>:</strong> <%:URI List%><br/>';
					preview_html += '<strong><%:Count%>:</strong> ' + (parsed_data.length || parsed_data.outbounds ? parsed_data.outbounds.length : 0) + '<br/><br/>';
					var items = parsed_data.outbounds || parsed_data;
					if (items && items.length > 0) {
						preview_html += '<ul style="list-style: none; padding: 0; margin: 0;">';
						for (var i = 0; i < Math.min(items.length, 10); i++) {
							var item = items[i];
							preview_html += '<li style="padding: 2px 0;">' + (i + 1) + '. <strong>' + (item.alias || item.protocol || 'Unknown') + '</strong> (' + (item.protocol || 'unknown') + ')</li>';
						}
						if (items.length > 10) {
							preview_html += '<li style="padding: 2px 0; color: #888;">... and ' + (items.length - 10) + ' more</li>';
						}
						preview_html += '</ul>';
					}
				} else if (data.format === 'xray_json' || data.format === 'singbox_json') {
					preview_html += '<strong><%:Format%>:</strong> ' + data.format + '<br/>';
					preview_html += '<strong><%:Outbounds%>:</strong> ' + (parsed_data.outbounds ? parsed_data.outbounds.length : 0) + '<br/><br/>';
					if (parsed_data.outbounds && parsed_data.outbounds.length > 0) {
						preview_html += '<ul style="list-style: none; padding: 0; margin: 0;">';
						for (var i = 0; i < Math.min(parsed_data.outbounds.length, 10); i++) {
							var outbound = parsed_data.outbounds[i];
							preview_html += '<li style="padding: 2px 0;">' + (i + 1) + '. <strong>' + (outbound.alias || outbound.tag || outbound._id || 'Unknown') + '</strong> (' + (outbound.protocol || 'unknown') + ')</li>';
						}
						if (parsed_data.outbounds.length > 10) {
							preview_html += '<li style="padding: 2px 0; color: #888;">... and ' + (parsed_data.outbounds.length - 10) + ' more</li>';
						}
						preview_html += '</ul>';
					}
				}
				preview_html += '</div>';
				import_preview.innerHTML = preview_html;
			} else {
				import_status.innerHTML = '<span style="color: red;">' + (data && data.message ? data.message : '<%:Failed to parse configuration%>') + '</span>';
				import_save_btn.style.display = 'none';
				import_preview_div.style.display = 'none';
				parsed_data = null;
			}
		});
	}

	import_save_btn.addEventListener('click', function() {
		if (!parsed_data) {
			import_status.innerHTML = '<span style="color: red;"><%:No parsed configuration data%></span>';
			return;
		}

		import_status.innerHTML = '<span style="color: orange;"><%:Saving configuration...%></span>';

		(new XHR()).post('<%=luci.dispatcher.build_url("admin/services/sxray/import/save")%>', {
			config_data: JSON.stringify(parsed_data)
		}, function(x, data) {
			if (x && x.status === 200 && data && data.success) {
				import_status.innerHTML = '<span style="color: green;">' + data.message + '</span>';
				setTimeout(function() {
					window.location.reload();
				}, 1500);
			} else {
				import_status.innerHTML = '<span style="color: red;">' + (data && data.message ? data.message : '<%:Failed to save configuration%>') + '</span>';
			}
		});
	});
})();
</script>
