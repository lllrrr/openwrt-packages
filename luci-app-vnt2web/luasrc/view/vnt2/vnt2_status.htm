<%
local dsp = require "luci.dispatcher"
local status_url = dsp.build_url("admin", "vpn", "vnt2", "status")
local check_preview_url = dsp.build_url("admin", "vpn", "vnt2", "check_preview")
%>

<style type="text/css">
	.vnt2-status-wrap {
		margin: 4px 0 12px;
	}
	.vnt2-status-grid {
		display: block;
	}
	.vnt2-card {
		border: 1px solid var(--border-color-medium, var(--border-color-high, #d9d9d9));
		border-radius: 4px;
		padding: 8px 10px;
		background: var(--card-background, var(--panel-bg, var(--background-color, #fff)));
		color: var(--text-color, inherit);
		box-shadow: none;
		font-size: 14px;
		line-height: 1.5;
	}
	.vnt2-card h3 {
		margin: 0 0 4px;
		font-size: 18px;
		font-weight: 600;
		line-height: 1.4;
		color: var(--text-color-high, var(--text-color, inherit));
	}
	.vnt2-badge {
		display: inline-block;
		min-width: 60px;
		padding: 0 7px;
		border-radius: 3px;
		font-size: 14px;
		font-weight: 400;
		line-height: 1.5;
		color: #fff;
		text-align: center;
		margin-left: 8px;
		vertical-align: middle;
	}
	.vnt2-on {
		background: #19a15f;
	}
	.vnt2-off {
		background: #d9534f;
	}
	.vnt2-warn {
		background: #f0ad4e;
	}
	.vnt2-card table {
		width: 100%;
		border-collapse: collapse;
		font: inherit;
		background: transparent;
		color: inherit;
	}
	.vnt2-card table tr,
	.vnt2-card table tbody,
	.vnt2-card table thead {
		background: transparent !important;
		color: inherit;
	}
	.vnt2-card td,
	.vnt2-card th {
		padding: 2px 0;
		border-bottom: 1px dashed var(--border-color-low, var(--border-color-medium, #ececec));
		vertical-align: top;
		word-break: break-all;
		background: transparent !important;
		box-shadow: none !important;
	}
	.vnt2-card td:first-child {
		width: 104px;
		color: var(--text-color-low, var(--text-color, #666));
		padding-right: 8px;
	}
	.vnt2-card td:last-child {
		color: var(--text-color-high, var(--text-color, #222));
	}
</style>

<div class="vnt2-status-wrap">
	<div class="vnt2-status-grid">
		<div class="vnt2-card">
			<h3>
				vnt2_web 客户端状态
				<span id="web_status_badge" class="vnt2-badge vnt2-off">未运行</span>
			</h3>
			<table>
				<tr><td>本地版本</td><td id="web_tag">-</td></tr>
				<tr><td>目标版本</td><td id="web_target_tag">-</td></tr>
				<tr><td>最新预览版</td><td id="web_preview_tag">-</td></tr>
				<tr><td>运行时长</td><td id="web_runtime">-</td></tr>
				<tr><td>进程/PID</td><td id="web_pid">-</td></tr>
				<tr><td>CPU / 内存</td><td id="web_usage">-</td></tr>
				<tr><td>访问地址</td><td id="web_url">-</td></tr>
				<tr><td>下载状态</td><td id="web_download">-</td></tr>
			</table>
		</div>
	</div>

</div>

<script type="text/javascript">
//<![CDATA[
(function() {
	var statusUrl = "<%=status_url%>";
	var checkPreviewUrl = "<%=check_preview_url%>";

	function byId(id) {
		return document.getElementById(id);
	}

	function escapeHtml(v) {
		return String(v)
			.replace(/&/g, "&amp;")
			.replace(/</g, "&lt;")
			.replace(/>/g, "&gt;")
			.replace(/"/g, "&quot;")
			.replace(/'/g, "&#39;");
	}

	function text(v, empty) {
		if (v === null || v === undefined || v === "") {
			return escapeHtml(empty || "-");
		}
		return escapeHtml(v);
	}

	function setBadge(id, running) {
		var node = byId(id);
		if (!node) return;
		node.className = "vnt2-badge " + (running ? "vnt2-on" : "vnt2-off");
		node.innerHTML = running ? "运行中" : "未运行";
	}

	function setHtml(id, value) {
		var node = byId(id);
		if (node) {
			node.innerHTML = value;
		}
	}

	function stateText(obj) {
		if (!obj) return "-";
		var items = [];
		if (obj.state) items.push("状态：" + text(obj.state));
		if (obj.tag) items.push("版本：" + text(obj.tag));
		if (obj.arch) items.push("架构：" + text(obj.arch));
		if (obj.asset) items.push("资源：" + text(obj.asset));
		if (obj.message) items.push(text(obj.message));
		if (obj.time) items.push("时间：" + text(obj.time));
		return items.length ? items.join("<br />") : "-";
	}

	function webUrlHtml(v) {
		if (v === null || v === undefined || v === "") return "-";
		var raw = String(v);
		var safe = escapeHtml(raw);
		if (!/^https?:\/\/[^\s]+$/i.test(raw)) return safe;
		return '<a href="' + safe + '" target="_blank" rel="noopener noreferrer">' + safe + "</a>";
	}

	function render(data) {
		setBadge("web_status_badge", data.web_running);

		setHtml("web_tag", text(data.web_tag));
		setHtml("web_target_tag", text(data.web_target_tag));
		setHtml("web_preview_tag", data.web_preview_tag ? text(data.web_preview_tag) : "未查询");
		setHtml("web_runtime", text(data.web_runtime));
		setHtml("web_pid", data.web_running ? ("PID " + text(data.web_pid)) : "未运行");
		setHtml("web_usage", [text(data.web_cpu, "0"), text(data.web_ram, "0 MB")].join(" / "));
		setHtml("web_url", webUrlHtml(data.web_url));
		setHtml("web_download", stateText(data.web_download));
	}

	function updateStatus() {
		XHR.get(statusUrl, null, function(x, data) {
			if (!data) {
				return;
			}
			render(data);
		});
	}

	XHR.get(checkPreviewUrl, null, function() {
		updateStatus();
	});
	updateStatus();
	window.setInterval(updateStatus, 5000);
})();
//]]>
</script>
