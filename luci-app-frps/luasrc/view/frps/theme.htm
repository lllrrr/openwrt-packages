<%# luci-app-frps 全局主题 — 紫色系卡片风格 (mirror frpc/theme) %>
<style>
:root {
	--frps-primary: #6366f1;
	--frps-primary-dark: #4f46e5;
	--frps-primary-light: #818cf8;
	--frps-primary-bg: #eef2ff;
	--frps-success: #10b981;
	--frps-success-bg: #ecfdf5;
	--frps-warn: #f59e0b;
	--frps-warn-bg: #fffbeb;
	--frps-danger: #ef4444;
	--frps-danger-bg: #fef2f2;
	--frps-text: #1f2937;
	--frps-text-muted: #6b7280;
	--frps-border: #e5e7eb;
	--frps-border-soft: #f3f4f6;
	--frps-bg: #f9fafb;
	--frps-card-bg: #ffffff;
	--frps-radius: 10px;
	--frps-radius-sm: 6px;
	--frps-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
	--frps-shadow-hover: 0 4px 12px rgba(99,102,241,0.12), 0 2px 4px rgba(0,0,0,0.06);
}

.cbi-map, #maincontent { background: transparent; }

.cbi-map > h2,
h2[name="content"] {
	color: var(--frps-text);
	font-weight: 700;
	font-size: 24px;
	letter-spacing: -0.3px;
	padding: 18px 20px 12px;
	margin: 0 0 16px 0;
	background: var(--frps-card-bg);
	border-radius: var(--frps-radius);
	box-shadow: var(--frps-shadow);
	border-left: 4px solid var(--frps-primary);
}
.cbi-map-descr {
	color: var(--frps-text-muted);
	background: var(--frps-card-bg);
	padding: 14px 20px;
	border-radius: var(--frps-radius);
	box-shadow: var(--frps-shadow);
	margin: 0 0 16px 0;
	font-size: 13px;
	line-height: 1.6;
	border-left: 3px solid var(--frps-primary-light);
}

fieldset.cbi-section {
	background: var(--frps-card-bg);
	border: none !important;
	border-radius: var(--frps-radius);
	box-shadow: var(--frps-shadow);
	padding: 18px 22px;
	margin: 0 0 16px 0;
	transition: box-shadow 0.2s;
}
fieldset.cbi-section:hover { box-shadow: var(--frps-shadow-hover); }
fieldset.cbi-section > legend,
fieldset.cbi-section > h3 {
	color: var(--frps-text);
	font-weight: 600;
	font-size: 16px;
	padding: 0 6px;
	margin-bottom: 8px;
	background: transparent;
	border: none;
}

.cbi-tabmenu, ul.cbi-tabmenu {
	background: transparent;
	border-bottom: 1px solid var(--frps-border);
	margin: 0 0 16px 0;
	padding: 0;
}
.cbi-tabmenu li, ul.cbi-tabmenu li {
	background: transparent !important;
	border: none !important;
	margin: 0 4px 0 0 !important;
}
.cbi-tabmenu li a, ul.cbi-tabmenu li a {
	color: var(--frps-text-muted) !important;
	background: transparent !important;
	padding: 10px 18px !important;
	border-radius: var(--frps-radius-sm) var(--frps-radius-sm) 0 0 !important;
	font-weight: 500;
	transition: all 0.15s;
}
.cbi-tabmenu li a:hover {
	color: var(--frps-primary) !important;
	background: var(--frps-primary-bg) !important;
}
.cbi-tabmenu li.cbi-tab a,
ul.cbi-tabmenu li.cbi-tab a {
	color: var(--frps-primary) !important;
	background: var(--frps-card-bg) !important;
	border-bottom: 2px solid var(--frps-primary) !important;
	font-weight: 600;
}

.cbi-button, input.cbi-button, button.cbi-button {
	border: 1px solid var(--frps-border) !important;
	border-radius: var(--frps-radius-sm) !important;
	padding: 6px 14px !important;
	font-weight: 500 !important;
	transition: all 0.15s !important;
	cursor: pointer;
	font-size: 13px !important;
	background: var(--frps-card-bg) !important;
	color: var(--frps-text) !important;
	box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.cbi-button:hover:not(:disabled) {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(99,102,241,0.15);
}
.cbi-button-save, .cbi-button-apply, .cbi-button-add, .cbi-button-positive,
input[value="保存"], input[value="保存并应用"], input[value="添加"] {
	background: var(--frps-primary) !important;
	color: #fff !important;
	border-color: var(--frps-primary) !important;
}
.cbi-button-save:hover, .cbi-button-apply:hover, .cbi-button-add:hover, .cbi-button-positive:hover {
	background: var(--frps-primary-dark) !important;
	border-color: var(--frps-primary-dark) !important;
}
.cbi-button-edit, .cbi-button-action {
	color: var(--frps-primary) !important;
	border-color: var(--frps-primary-light) !important;
}
.cbi-button-remove, .cbi-button-negative, .cbi-button-reset,
input[value="删除"], input[value="复位"] {
	background: var(--frps-card-bg) !important;
	color: var(--frps-danger) !important;
	border-color: var(--frps-danger) !important;
	opacity: 0.9;
}
.cbi-button-remove:hover, .cbi-button-negative:hover, .cbi-button-reset:hover {
	background: var(--frps-danger) !important;
	color: #fff !important;
}

.cbi-section-table, table.cbi-section-table {
	background: transparent; border-collapse: separate; border-spacing: 0; width: 100%;
}
.cbi-section-table-titles, .cbi-section-table-titles th,
tr.cbi-section-table-titles th {
	background: var(--frps-border-soft) !important;
	color: var(--frps-text-muted) !important;
	font-weight: 600 !important;
	text-transform: none !important;
	font-size: 12px !important;
	padding: 12px 14px !important;
	border: none !important;
	border-bottom: 1px solid var(--frps-border) !important;
}
.cbi-section-table-titles th:first-child { border-top-left-radius: var(--frps-radius-sm); }
.cbi-section-table-titles th:last-child  { border-top-right-radius: var(--frps-radius-sm); }
.cbi-section-table-descr th,
tr.cbi-section-table-descr th {
	background: transparent !important;
	color: var(--frps-text-muted) !important;
	font-weight: 400 !important;
	font-style: normal !important;
	font-size: 11px !important;
	padding: 6px 14px !important;
	border: none !important;
}
.cbi-section-table-row, tr.cbi-section-table-row {
	background: transparent !important; border: none !important; transition: background 0.12s;
}
.cbi-section-table-row:hover { background: var(--frps-primary-bg) !important; }
.cbi-section-table-row td, tr.cbi-section-table-row td {
	background: transparent !important;
	border: none !important;
	border-bottom: 1px solid var(--frps-border-soft) !important;
	padding: 12px 14px !important;
	color: var(--frps-text);
}

input[type="text"], input[type="password"], input[type="number"],
input[type="email"], input[type="url"], select, textarea {
	border: 1px solid var(--frps-border) !important;
	border-radius: var(--frps-radius-sm) !important;
	padding: 6px 10px !important;
	background: var(--frps-card-bg) !important;
	color: var(--frps-text) !important;
	font-size: 13px !important;
	transition: all 0.15s !important;
	box-shadow: 0 1px 2px rgba(0,0,0,0.03) !important;
}
input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus,
select:focus, textarea:focus {
	outline: none !important;
	border-color: var(--frps-primary) !important;
	box-shadow: 0 0 0 3px rgba(99,102,241,0.15) !important;
}
input[type="checkbox"] {
	accent-color: var(--frps-primary);
	width: 16px; height: 16px; cursor: pointer;
}

.cbi-value-title { color: var(--frps-text); font-weight: 500; font-size: 13px; }
.cbi-value-description { color: var(--frps-text-muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }

.cbi-section .cbi-value:not(:last-child) { border-bottom: 1px solid var(--frps-border-soft); }
.cbi-value { padding: 12px 0; }

.cbi-page-actions {
	background: var(--frps-card-bg);
	border-radius: var(--frps-radius);
	box-shadow: var(--frps-shadow);
	padding: 14px 20px;
	margin-top: 16px;
	text-align: right;
}

.errorbox, .alert-message.warning, .alert-message.error {
	border-radius: var(--frps-radius-sm);
	padding: 12px 16px;
	border: none;
	box-shadow: var(--frps-shadow);
}
.alert-message.error, .errorbox { background: var(--frps-danger-bg); color: var(--frps-danger); }
.alert-message.warning { background: var(--frps-warn-bg); color: var(--frps-warn); }

.cbi-section .cbi-section-descr {
	background: var(--frps-primary-bg);
	border-radius: var(--frps-radius-sm);
	padding: 12px 14px;
	margin-bottom: 12px;
	color: var(--frps-text);
	font-size: 13px;
	border-left: 3px solid var(--frps-primary-light);
}

.cbi-map a, .cbi-section a { color: var(--frps-primary); text-decoration: none; }
.cbi-map a:hover { text-decoration: underline; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--frps-border-soft); }
::-webkit-scrollbar-thumb { background: var(--frps-primary-light); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--frps-primary); }
</style>
<script>
// 按钮文本兜底 + 颜色强制覆盖
(function() {
	function inferButtonText(b) {
		var oc = (b.getAttribute('onclick') || '').toLowerCase();
		var cls = (b.className || '').toLowerCase();
		var title = (b.title || b.alt || '').toLowerCase();
		if (oc.indexOf('cbi_row_swap') >= 0) {
			if (oc.indexOf('true') >= 0) return '↑';
			if (oc.indexOf('false') >= 0) return '↓';
		}
		if (oc.indexOf("location.href") >= 0) return '编辑';
		if (cls.indexOf('cbi-button-edit') >= 0) return '编辑';
		if (cls.indexOf('cbi-button-action') >= 0 && title.indexOf('edit') >= 0) return '编辑';
		if (oc.indexOf('del-section') >= 0) return '删除';
		if (cls.indexOf('cbi-button-remove') >= 0) return '删除';
		if (cls.indexOf('cbi-button-add') >= 0) return '添加';
		return null;
	}
	function applyForce() {
		try {
			var btns = document.querySelectorAll(
				'tr.cbi-section-table-row input[type="button"],' +
				'tr.cbi-section-table-row input[type="submit"],' +
				'input.cbi-button-up, input.cbi-button-down,' +
				'input.cbi-button-edit, input.cbi-button-remove,' +
				'input.cbi-button-add'
			);
			for (var i = 0; i < btns.length; i++) {
				var b = btns[i];
				var want = inferButtonText(b);
				if (want && b.value !== want) {
					b.value = want;
					b.setAttribute('value', want);
				}
				var paint = function(el, normal, hover) {
					var apply = function(s) {
						for (var k in s) el.style.setProperty(k, s[k], 'important');
					};
					if (el._frpsPainted) return;
					el._frpsPainted = true;
					apply(normal);
					el.addEventListener('mouseenter', function(){ apply(hover); });
					el.addEventListener('mouseleave', function(){ apply(normal); });
				};
				if (b.className.indexOf('cbi-button-edit') >= 0) {
					paint(b,
						{ 'color': '#6366f1', 'background': '#ffffff', 'background-color': '#ffffff',
						  'border-color': '#c7d2fe', 'font-weight': '500' },
						{ 'color': '#ffffff', 'background': '#6366f1', 'background-color': '#6366f1',
						  'border-color': '#6366f1', 'font-weight': '500' });
				} else if (b.className.indexOf('cbi-button-remove') >= 0) {
					paint(b,
						{ 'color': '#ef4444', 'background': '#ffffff', 'background-color': '#ffffff',
						  'border-color': '#ef4444' },
						{ 'color': '#ffffff', 'background': '#ef4444', 'background-color': '#ef4444',
						  'border-color': '#ef4444' });
				}
			}
		} catch (e) {}
	}
	applyForce();
	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', applyForce);
	}
	var ticks = 0;
	var iv = setInterval(function() {
		applyForce();
		if (++ticks > 33) clearInterval(iv);
	}, 300);
	window.addEventListener('load', applyForce);
})();

function frpsEnsureButtonText() {
	var labels = {
		'cbi-button-edit':   '编辑',
		'cbi-button-up':     '↑',
		'cbi-button-down':   '↓',
		'cbi-button-remove': '删除',
		'cbi-button-add':    '添加',
		'cbi-button-save':   '保存',
		'cbi-button-apply':  '保存并应用',
		'cbi-button-reset':  '复位'
	};
	Object.keys(labels).forEach(function(cls) {
		document.querySelectorAll('input.' + cls).forEach(function(input) {
			if (!input.value || input.value.trim() === '' || /^(Edit|Up|Down|Delete|Add|Save|Apply|Reset)$/i.test(input.value.trim())) {
				input.value = labels[cls];
			}
		});
	});
}
var __frpsArrowStyle = document.createElement('style');
__frpsArrowStyle.textContent =
	'input.cbi-button-up, input.cbi-button-down,' +
	'input.cbi-button-up:hover, input.cbi-button-down:hover,' +
	'input.cbi-button-up:hover:not(:disabled), input.cbi-button-down:hover:not(:disabled) {' +
	'  min-width: 32px !important; padding: 4px 8px !important;' +
	'  font-family: -apple-system, "Segoe UI Symbol", sans-serif !important;' +
	'  font-size: 14px !important; font-weight: 700 !important;' +
	'  color: var(--frps-text-muted) !important;' +
	'  background: var(--frps-card-bg) !important;' +
	'  background-color: var(--frps-card-bg) !important;' +
	'  border-color: var(--frps-border) !important;' +
	'  transform: none !important;' +
	'  box-shadow: 0 1px 2px rgba(0,0,0,0.04) !important;' +
	'}' +
	'input.cbi-button-edit {' +
	'  background: var(--frps-card-bg) !important;' +
	'  color: var(--frps-primary) !important;' +
	'  border-color: var(--frps-primary-light) !important;' +
	'  font-weight: 500 !important;' +
	'  min-width: 56px;' +
	'}' +
	'input.cbi-button-edit:hover:not(:disabled) {' +
	'  background: var(--frps-primary) !important;' +
	'  color: #fff !important;' +
	'}';
document.head.appendChild(__frpsArrowStyle);

document.addEventListener('DOMContentLoaded', function() {
	frpsEnsureButtonText();
	setTimeout(frpsEnsureButtonText, 50);
	setTimeout(frpsEnsureButtonText, 300);
	setTimeout(frpsEnsureButtonText, 1000);
	setTimeout(frpsEnsureButtonText, 2500);
});
if (window.MutationObserver) {
	var mo = new MutationObserver(function() {
		if (mo._t) clearTimeout(mo._t);
		mo._t = setTimeout(frpsEnsureButtonText, 100);
	});
	document.addEventListener('DOMContentLoaded', function() {
		mo.observe(document.body, {
			childList: true, subtree: true,
			attributes: true, attributeFilter: ['value', 'class']
		});
	});
}
window.addEventListener('load', frpsEnsureButtonText);
</script>
