<%+header%>

<div class="cbi-map" id="devicemaster-map">
    <div class="cbi-section-node">
        <div class="cbi-section">
            <h3>网络设备</h3>
            <div class="cbi-section-descr">管理和监控网络中的所有设备</div>
            
            <div class="devicemaster-toolbar">
                <button class="btn cbi-button cbi-button-action" id="btn-refresh">刷新</button>
                <button class="btn cbi-button cbi-button-action" id="btn-scan">扫描网络</button>
                <div class="devicemaster-filter">
                    <input type="text" id="filter-input" placeholder="搜索设备..." />
                </div>
            </div>
            
            <div class="devicemaster-stats" id="stats-summary">
                <div class="stat-box"><span class="stat-value" id="stat-total">0</span><span class="stat-label">总计</span></div>
                <div class="stat-box online"><span class="stat-value" id="stat-online">0</span><span class="stat-label">在线</span></div>
                <div class="stat-box offline"><span class="stat-value" id="stat-offline">0</span><span class="stat-label">离线</span></div>
            </div>
            
            <div class="devicemaster-devices" id="device-list"><div class="loading">加载中...</div></div>
        </div>
    </div>
</div>

<style>
.devicemaster-toolbar{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;align-items:center;padding-left:20px}
.devicemaster-filter{display:flex;gap:10px;flex:1;justify-content:flex-end}
.devicemaster-filter input{padding:5px 10px;border:1px solid #ccc;border-radius:4px}
.devicemaster-stats{display:flex;gap:15px;margin-bottom:20px;flex-wrap:wrap;padding-left:20px}
.stat-box{background:#f5f5f5;padding:15px 25px;border-radius:8px;text-align:center;min-width:80px}
.stat-box.online{background:#d4edda}
.stat-box.offline{background:#f8d7da}
.stat-value{display:block;font-size:24px;font-weight:bold;color:#333}
.stat-label{font-size:12px;color:#666}
.devicemaster-devices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding-left:20px}
.device-card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:15px}
.device-card.offline{opacity:0.6}
.device-card.blocked{border-color:#dc3545;background:#fff5f5}
.device-card.limited{border-color:#ffc107;background:#fffbf0}
.device-card.upstream{background:#f0f4f8;border-color:#c5d0db;border-style:dashed}
.device-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.device-info{flex:1;min-width:0}
.device-name{font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.device-vendor{font-size:12px;color:#666;margin-top:2px}
.device-type{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:bold;margin-left:6px;vertical-align:middle}
.device-type.phone{background:#e3f2fd;color:#1565c0}
.device-type.pc{background:#f3e5f5;color:#7b1fa2}
.device-type.iot{background:#fff3e0;color:#e65100}
.device-type.network{background:#e8f5e9;color:#2e7d32}
.device-type.unknown{background:#f5f5f5;color:#9e9e9e}
.device-details{font-size:12px;color:#888;margin-bottom:10px}
.device-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.device-actions .btn{font-size:11px;padding:3px 8px}
.device-hint{line-height:17px}
.device-status{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:8px}
.device-status.online{background:#28a745;box-shadow:0 0 4px #28a745}
.device-status.offline{background:#6c757d}
.device-status.blocked{background:#dc3545;box-shadow:0 0 4px #dc3545}
.device-status.limited{background:#ffc107;box-shadow:0 0 4px #ffc107}
.loading{text-align:center;padding:40px;color:#666}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* 移动端响应式布局 */
@media screen and (max-width: 768px) {
    .devicemaster-toolbar{padding-left:10px;gap:8px}
    .devicemaster-filter{width:100%;justify-content:flex-start}
    .devicemaster-filter input{width:100%;max-width:300px}
    .devicemaster-stats{padding-left:10px;gap:10px}
    .stat-box{padding:10px 15px;min-width:70px}
    .stat-value{font-size:20px}
    .devicemaster-devices{padding-left:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
    .device-card{padding:10px}
    .device-name{font-size:13px}
    .device-vendor{font-size:11px}
    .device-details{font-size:11px}
    .device-actions .btn{font-size:10px;padding:2px 6px}
}

@media screen and (max-width: 480px) {
    .devicemaster-devices{grid-template-columns:1fr}
    .device-card{padding:12px}
    .device-name{font-size:14px}
    .device-actions{gap:4px}
    .device-actions .btn{font-size:11px;padding:3px 8px}
    .stat-box{padding:8px 12px;min-width:60px}
    .stat-value{font-size:18px}
    .stat-label{font-size:11px}
}
</style>

<script type="text/javascript">
(function(){
var devices=[];
var deviceMap={};
var apiUrl = '<%=luci.dispatcher.build_url("admin/network/devicemaster/api")%>';
var typeLabels = {'phone':'手机','pc':'电脑','iot':'IoT','network':'网络','unknown':'未知'};

function httpGet(url, callback) {
    var xhr = new XMLHttpRequest();
    // Add timestamp to prevent browser caching
    var nocacheUrl = url + (url.indexOf('?') > -1 ? '&' : '?') + '_t=' + Date.now();
    xhr.open('GET', nocacheUrl, true);
    xhr.setRequestHeader('Cache-Control', 'no-cache');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                try { callback(JSON.parse(xhr.responseText)); } catch(e) { callback(null); }
            } else { callback(null); }
        }
    };
    xhr.send();
}

function httpPost(url, data, callback) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && callback) {
            var res = null;
            try { res = JSON.parse(xhr.responseText); } catch(e) {}
            callback(res);
        }
    };
    xhr.send(data);
}

function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function getStatusClass(d) {
    if (d.blocked) return 'blocked';
    if (d.rate_limit) return 'limited';
    return d.online ? 'online' : 'offline';
}

function buildCardHTML(d) {
    var name = d.custom_name || d.hostname || d.mac;
    var cls = getStatusClass(d);
    var upstream = d.is_controllable === false;
    if (upstream) cls += ' upstream';
    var typeLabel = typeLabels[d.type] || typeLabels['unknown'];
    var h = '<div class="device-card ' + cls + '" id="card-' + d.mac.replace(/:/g,'') + '">';
    h += '<div class="device-header"><div class="device-info">';
    h += '<div class="device-name">' + escapeHtml(name) + '</div>';
    var meshBadge = (d.topology === 'mesh_node' && d.mesh_connected) ? ' <span class="device-type mesh" style="background:#4caf50;color:#fff;">mesh</span>' : '';
    h += '<div class="device-vendor">' + escapeHtml(d.vendor || '未知') + ' <span class="device-type ' + (d.type || 'unknown') + '">' + typeLabel + '</span>' + meshBadge + '</div>';
    h += '</div><span class="device-status ' + getStatusClass(d) + '" id="status-' + d.mac.replace(/:/g,'') + '"></span></div>';
    var detailsHtml = '<div>MAC: ' + d.mac + '</div><div>IP: ' + (d.ip || 'N/A') + '</div>';
    if (d.rate_limit) {
        detailsHtml += '<div style="color:#e65100;font-weight:bold;">限速: ' + escapeHtml(d.rate_limit) + '</div>';
    }
    h += '<div class="device-details">' + detailsHtml + '</div>';
    h += '<div class="device-actions">';
    h += '<button class="btn cbi-button" onclick="editDevice(\'' + d.mac + '\')">编辑</button>';
    if (upstream) {
        h += '<span class="device-hint" style="color:#888;font-size:11px;">上游设备不可控</span>';
    } else {
        if (d.blocked) {
            h += '<button class="btn cbi-button cbi-button-positive" onclick="unblockDevice(\'' + d.mac + '\')">解除限制</button>';
        } else {
            h += '<button class="btn cbi-button cbi-button-negative" onclick="blockDevice(\'' + d.mac + '\')">封禁</button>';
        }
        h += '<button class="btn cbi-button" onclick="limitDevice(\'' + d.mac + '\')">限速</button>';
    }
    h += '</div></div>';
    return h;
}

// Full render (first load, scan, filter change)
function renderDevices() {
    var listEl = document.getElementById('device-list');
    var filterText = document.getElementById('filter-input').value.toLowerCase();
    var filtered = devices.filter(function(d) {
        if (!filterText) return true;
        return (d.hostname||'').toLowerCase().indexOf(filterText)>=0 || d.mac.toLowerCase().indexOf(filterText)>=0 || (d.ip||'').toLowerCase().indexOf(filterText)>=0;
    });
    if (filtered.length === 0) { listEl.innerHTML = '<div class="loading">未发现设备</div>'; updateStats(); return; }
    var html = '';
    for (var i = 0; i < filtered.length; i++) html += buildCardHTML(filtered[i]);
    listEl.innerHTML = html;
    
    // Add double-click event listeners for delete
    var cards = listEl.querySelectorAll('.device-card');
    for (var i = 0; i < cards.length; i++) {
        cards[i].addEventListener('dblclick', function(e) {
            // Prevent double-click on buttons
            if (e.target.tagName === 'BUTTON') return;
            var mac = this.id.replace('card-', '').replace(/(.{2})(?=.)/g, '$1:');
            confirmDeleteDevice(mac);
        });
    }
    
    updateStats();
}

// Silent background refresh - call real-time status API
function silentRefresh() {
    if (document.hidden) return;
    httpGet(apiUrl + '/status', function(res) {
        if (!res || !res.devices) return;
        var newDevices = res.devices;
        var newMap = {};
        for (var i = 0; i < newDevices.length; i++) newMap[newDevices[i].mac] = newDevices[i];

        var listEl = document.getElementById('device-list');
        var filterText = document.getElementById('filter-input').value.toLowerCase();

        // 1. Update existing cards & detect status changes
        for (var i = 0; i < devices.length; i++) {
            var old = devices[i];
            var nw = newMap[old.mac];
            if (!nw) continue;
            var cardId = 'card-' + old.mac.replace(/:/g,'');
            var card = document.getElementById(cardId);
            if (!card) continue;
            var oldCls = getStatusClass(old);
            var newCls = getStatusClass(nw);
            if (oldCls !== newCls) {
                var statusEl = document.getElementById('status-' + old.mac.replace(/:/g,''));
                if (statusEl) { statusEl.className = 'device-status ' + newCls; }
                card.className = 'device-card ' + newCls;
            }
            if (old.ip !== nw.ip) {
                var detailDivs = card.querySelectorAll('.device-details div');
                if (detailDivs[1]) detailDivs[1].textContent = 'IP: ' + (nw.ip || 'N/A');
            }
        }

        // 2. Add new device cards
        var existingMap = {};
        for (var i = 0; i < devices.length; i++) existingMap[devices[i].mac] = true;
        for (var i = 0; i < newDevices.length; i++) {
            var d = newDevices[i];
            if (!existingMap[d.mac]) {
                if (!filterText || (d.hostname||'').toLowerCase().indexOf(filterText)>=0 || d.mac.toLowerCase().indexOf(filterText)>=0 || (d.ip||'').toLowerCase().indexOf(filterText)>=0) {
                    var tmp = document.createElement('div');
                    tmp.innerHTML = buildCardHTML(d);
                    var newCard = tmp.firstChild;
                    newCard.style.animation = 'fadeIn 0.5s ease';
                    listEl.appendChild(newCard);
                }
            }
        }

        // 3. Update stats
        devices = newDevices;
        deviceMap = newMap;
        updateStats();
    });
}

function updateStats() {
    document.getElementById('stat-total').textContent = devices.length;
    var online = 0;
    for (var j = 0; j < devices.length; j++) { if (devices[j].online) online++; }
    document.getElementById('stat-online').textContent = online;
    document.getElementById('stat-offline').textContent = devices.length - online;
}

function loadDevices(){
    var listEl = document.getElementById('device-list');
    listEl.innerHTML = '<div class="loading">加载中...</div>';
    httpGet(apiUrl + '/status', function(res) {
        if (res && res.devices) {
            devices = res.devices;
            deviceMap = {};
            for (var i = 0; i < devices.length; i++) deviceMap[devices[i].mac] = devices[i];
            renderDevices();
        } else {
            listEl.innerHTML = '<div class="loading">加载失败</div>';
        }
    });
}

function scanNetwork(){
    var listEl = document.getElementById('device-list');
    listEl.innerHTML = '<div class="loading">正在扫描网络...</div>';
    httpPost(apiUrl + '/scan_network', '', function() { setTimeout(loadDevices, 3000); });
}

window.editDevice = function(mac) {
    var device = deviceMap[mac];
    if (!device) return;
    var name = prompt('设备名称:', device.custom_name || device.hostname || '');
    if (name === null) return;
    var vendor = prompt('厂商 (请勿修改，除非确定):', device.vendor || '');
    if (vendor === null) return;
    var devtype = prompt('设备类型 (phone, pc, iot, network, unknown):', device.type || 'unknown');
    if (devtype === null) return;
    var group = prompt('分组 (个人, IoT, 访客, 安全):', device.group || '');
    if (group === null) return;
    httpPost(apiUrl + '/set_name', 'mac=' + encodeURIComponent(mac) + '&name=' + encodeURIComponent(name) + '&vendor=' + encodeURIComponent(vendor) + '&devtype=' + encodeURIComponent(devtype) + '&group=' + encodeURIComponent(group), loadDevices);
};

window.blockDevice = function(mac) {
    if (confirm('确定要封禁该设备吗？')) {
        httpPost(apiUrl + '/block', 'mac=' + encodeURIComponent(mac), loadDevices);
    }
};

window.unblockDevice = function(mac) {
    httpPost(apiUrl + '/unblock', 'mac=' + encodeURIComponent(mac), loadDevices);
};

window.limitDevice = function(mac) {
    var rate = prompt('请输入限速值 (例如 1、1M、1k)，留空则解除限速:');
    if (rate === null) return; // 用户点击取消
    if (rate === '') {
        // 空值解除限速
        httpPost(apiUrl + '/unlimit', 'mac=' + encodeURIComponent(mac), loadDevices);
    } else {
        // 处理简写单位
        rate = rate.trim().toLowerCase();
        // 纯数字默认 mbit
        if (/^\d+$/.test(rate)) {
            rate = rate + 'mbit';
        }
        // 简写转换：1m -> 1mbit, 1k -> 1kbit
        else if (/^(\d+)m$/.test(rate)) {
            rate = rate.replace(/^(\d+)m$/, '$1mbit');
        }
        else if (/^(\d+)k$/.test(rate)) {
            rate = rate.replace(/^(\d+)k$/, '$1kbit');
        }
        httpPost(apiUrl + '/limit', 'mac=' + encodeURIComponent(mac) + '&rate=' + encodeURIComponent(rate), loadDevices);
    }
};

// Delete device record (double-click on card)
window.confirmDeleteDevice = function(mac) {
    var device = deviceMap[mac];
    var name = device ? (device.custom_name || device.hostname || mac) : mac;
    if (confirm('确定要删除设备 "' + name + '" 的记录吗？\n\n设备重新上线后会被自动发现并重新记录。')) {
        httpPost(apiUrl + '/delete_device', 'mac=' + encodeURIComponent(mac), function(res) {
            if (res && res.success) {
                loadDevices();
            } else {
                alert('删除失败: ' + (res && res.error ? res.error : '未知错误'));
            }
        });
    }
};

document.addEventListener('DOMContentLoaded', function() {
    loadDevices();
    document.getElementById('btn-refresh').addEventListener('click', loadDevices);
    document.getElementById('btn-scan').addEventListener('click', scanNetwork);
    document.getElementById('filter-input').addEventListener('input', renderDevices);

    // Auto-refresh: only when page is visible, stop when hidden
    var refreshTimer = null;
    function startRefresh() {
        if (refreshTimer) return;
        refreshTimer = setInterval(silentRefresh, 3000);
    }
    function stopRefresh() {
        if (refreshTimer) {
            clearInterval(refreshTimer);
            refreshTimer = null;
        }
    }
    startRefresh();

    // Dual-mode: notify backend when page opens/closes
    function setBackendMode(mode) {
        httpPost(apiUrl + '/set_mode', 'mode=' + mode, function(){});
    }
    
    // Set active mode on page load
    setBackendMode('active');
    
    // Tab visibility: pause refresh and set idle mode when hidden
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            stopRefresh();
            setBackendMode('idle');
        } else {
            setBackendMode('active');
            silentRefresh();
            startRefresh();
        }
    });
    
    // Set idle mode when page unloads (close/refresh/navigate away)
    window.addEventListener('beforeunload', function() {
        setBackendMode('idle');
    });
});
})();
</script>

<%+footer%>
