# luci-app-workbuddy：AI 中转服务器转发效率调优
#
# 由 install.sh 部署到 /etc/sysctl.d/，卸载时由 install.sh remove 删除并还原默认值。
# 全部是标准内核转发参数，可随时回滚：删掉本文件后
#   /etc/init.d/sysctl restart      （或重启路由器）
#
# 实测依据（2026-09-26，ImmortalWrt SNAPSHOT r0-9f538e2，qualcommax/ipq60xx）：
#   默认值 tcp_slow_start_after_idle=1  tcp_fastopen=1
#          tcp_mtu_probing=0            tcp_max_syn_backlog=128
#          somaxconn=4096（已足够，不动）

# 长连接空闲后不再重新慢启动。
# 聊天走的是 SSE 长连接：模型思考/停顿几秒后继续输出时，默认行为会把拥塞窗口
# 打回初始值，表现为"回答后半段突然变慢"。中转上的每一路流式回答都受益。
net.ipv4.tcp_slow_start_after_idle=0

# TCP Fast Open：客户端与服务端都启用，省掉一次 TCP 往返。
# 中转每个请求都要新建到上游的连接，省下的就是每个请求的固定延迟。
net.ipv4.tcp_fastopen=3

# 路径 MTU 自动探测：避免 PMTU 黑洞导致的大包静默丢失与重传（表现为大响应卡住）。
net.ipv4.tcp_mtu_probing=1

# 公网 18889 暴露的转发服务：SYN 队列默认 128 偏小，突发并发时会丢连接。
# 内核 somaxconn 已是 4096，这里跟上即可。
net.ipv4.tcp_max_syn_backlog=1024
