<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智能分流界面原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：路由器后台式的单栏工作区，顶部状态条 + 标签页；规则以“一句话”横排，手机上竖排 */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --sunk: #eef2f4; --line: #dbe2e6; --fg: #16222a; --muted: #5a6a74;
  --accent: #0b7a72; --accent-ink: #ffffff; --accent-weak: #e0f2ef;
  --good: #187a47; --good-weak: #e3f4ea; --warn: #a76200; --warn-weak: #fdf1dc; --bad: #b8382b; --bad-weak: #fbe7e4;
  --shadow: 0 1px 2px rgba(22,34,42,.06), 0 4px 16px rgba(22,34,42,.06);
  --f-body: "Inter", "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-head: "Noto Sans SC", "Inter", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1417; --surface: #162026; --sunk: #111a1f; --line: #26333b; --fg: #e2eaee; --muted: #92a3ad;
  --accent: #3dbdaf; --accent-ink: #062320; --accent-weak: #12312e;
  --good: #4cc387; --good-weak: #13301f; --warn: #e2a640; --warn-weak: #33260e; --bad: #f06c5f; --bad-weak: #3a1814;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1417; --surface: #162026; --sunk: #111a1f; --line: #26333b; --fg: #e2eaee; --muted: #92a3ad;
  --accent: #3dbdaf; --accent-ink: #062320; --accent-weak: #12312e;
  --good: #4cc387; --good-weak: #13301f; --warn: #e2a640; --warn-weak: #33260e; --bad: #f06c5f; --bad-weak: #3a1814;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--f-head); margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 15px; font-weight: 700; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 顶部 */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.top .title { display: grid; gap: 2px; margin-right: auto; }
.proto { font-size: 12px; color: var(--muted); }
.proto b { color: var(--warn); font-weight: 600; }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { width: 44px; height: 24px; border-radius: 12px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--sunk); }
.btn.danger { color: var(--bad); }

/* 标签页 */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs a:hover { color: var(--fg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.panel-head h2 { margin-right: auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

/* 提示条 */
.alert { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 14px; border-radius: 9px; border: 1px solid; }
.alert p { margin: 0; flex: 1 1 260px; min-width: 0; }
.alert.warn { background: var(--warn-weak); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.alert.bad { background: var(--bad-weak); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.alert.off { background: var(--sunk); border-color: var(--line); }
.alert strong { font-weight: 600; }

/* 状态点与标签 */
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.idle { background: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.good { background: var(--good-weak); color: var(--good); }
.pill.bad { background: var(--bad-weak); color: var(--bad); }
.pill.warn { background: var(--warn-weak); color: var(--warn); }
.pill.idle { background: var(--sunk); color: var(--muted); }

.rows { display: grid; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1 1 200px; min-width: 0; }
.row .right { margin-left: auto; text-align: right; }

/* 一句话规则 */
.rule { display: grid; grid-template-columns: 28px 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.rule + .rule { margin-top: 8px; }
.rule.dragging { opacity: .5; }
.rule.over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-weak); }
.rule.disabled-all { opacity: .55; }
.handle { cursor: grab; color: var(--muted); text-align: center; font-size: 18px; line-height: 1; letter-spacing: -2px; user-select: none; }
.order { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); text-align: center; }
.sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.sentence .w { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 6px; background: var(--sunk); border: 1px solid var(--line); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.exit { background: var(--accent-weak); border-color: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--fg); font-weight: 600; }
.chip.not { border-style: dashed; }
.rule-meta { display: flex; align-items: center; gap: 4px; }
.hits { font-size: 12px; color: var(--muted); margin-right: 6px; white-space: nowrap; }
.confirm { display: flex; align-items: center; gap: 6px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

/* 表格 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; font-weight: 500; color: var(--muted); border-top: 0; white-space: nowrap; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }

/* 表单 */
.field { display: grid; gap: 6px; }
.field > label, .field > .label { font-weight: 600; font-size: 13px; }
.field .help { font-size: 12.5px; color: var(--muted); }
input[type=text], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; width: 100%; min-width: 0; }
textarea { min-height: 120px; font-family: var(--f-mono); font-size: 12.5px; resize: vertical; }
.radios { display: grid; gap: 6px; }
.radios label { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; cursor: pointer; }
.radios input { margin-top: 4px; accent-color: var(--accent); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; align-items: center; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.found { display: inline-flex; align-items: center; gap: 6px; }

/* 设备选择 */
.devlist { border: 1px solid var(--line); border-radius: 8px; max-height: 220px; overflow-y: auto; }
.devlist label { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); cursor: pointer; }
.devlist label:first-child { border-top: 0; }
.devlist input { accent-color: var(--accent); }
.devlist .dname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 弹层 */
.overlay { position: fixed; inset: 0; background: rgba(10,18,22,.45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 18px; display: grid; gap: 14px; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; }
.preview { background: var(--sunk); border-radius: 8px; padding: 10px 12px; }

.demo { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.demo .label { font-size: 12px; color: var(--muted); margin-right: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; box-shadow: var(--shadow); z-index: 30; max-width: calc(100% - 32px); display: flex; gap: 12px; align-items: center; }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }

.spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .track, .track::after { transition: none; } }

@media (max-width: 560px) {
  .rule { grid-template-columns: 22px minmax(0, 1fr); }
  .rule .handle { display: none; }
  .rule .rule-meta { grid-column: 1 / -1; justify-content: flex-end; }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .kv dt { margin-top: 6px; }
}

/* v2/v3：批量操作、设备组、问号提示 */
.rule { grid-template-columns: 20px 18px 24px minmax(0, 1fr) auto; }
.rule.off .sentence { opacity: .5; }
.rule.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent-weak) 45%, var(--surface)); }
.check { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; cursor: pointer; }
.bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--accent-weak); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.bulk .count { font-weight: 600; margin-right: 4px; }
.bulk select { width: auto; padding: 4px 8px; font-size: 13px; }
.listhead { display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 13px; color: var(--muted); }
.tag { font-size: 11px; color: var(--muted); padding-right: 6px; margin-right: 2px; border-right: 1px solid var(--line); }
.switch.sm { gap: 0; }
.switch.sm .track { width: 34px; height: 20px; }
.switch.sm .track::after { width: 14px; height: 14px; }
.switch.sm input:checked + .track::after { transform: translateX(14px); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar input[type=text] { flex: 1 1 200px; width: auto; }
td.c, th.c { width: 34px; padding-right: 0; }
.dev-name { display: inline-flex; align-items: center; gap: 6px; }
.unnamed { color: var(--muted); font-style: italic; }
.dev-name input, .scan input[type=text] { width: 140px; padding: 3px 8px; }
.mini { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 5px; background: var(--sunk); border: 1px solid var(--line); margin: 1px 4px 1px 0; white-space: nowrap; }
.pick { border: 1px solid var(--line); border-radius: 8px; max-height: 280px; overflow-y: auto; }
.pick h3 { font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 10px 4px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.pick label { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; cursor: pointer; }
.pick label:hover { background: var(--sunk); }
.pick .dname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.grp + .grp { margin-top: 10px; }
.grp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 12px; background: var(--sunk); }
.grp-head .gname { font-weight: 700; margin-right: auto; display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; font-size: 14px; }
.grp-head .caret { display: inline-block; transition: transform .15s; color: var(--muted); }
.grp.closed .caret { transform: rotate(-90deg); }
.grp table td, .grp table th { padding: 8px 12px; }
.grp .empty { padding: 12px; margin: 0; }
.scan { border: 1px solid var(--line); border-radius: 8px; max-height: 300px; overflow: auto; }
.scan table { min-width: 560px; }
.scan tr.in td { opacity: .55; }

/* 问号提示：鼠标移上去或键盘/手指聚焦时显示 */
.tip { position: relative; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); background: transparent; font: 600 11px/1 var(--f-body); cursor: help; padding: 0; vertical-align: middle; flex: none; }
.tip:hover, .tip:focus-visible { color: var(--accent); border-color: var(--accent); }
.tipbox { position: fixed; z-index: 50; max-width: min(280px, calc(100vw - 24px)); padding: 7px 10px; border-radius: 7px; background: var(--fg); color: var(--bg); font: 400 12.5px/1.55 var(--f-body); box-shadow: var(--shadow); pointer-events: none; }
.h-tip { display: inline-flex; align-items: center; gap: 6px; }
@media (prefers-reduced-motion: reduce) { .grp-head .caret { transition: none; } }
@media (max-width: 560px) {
  .rule { grid-template-columns: 20px 22px minmax(0, 1fr); }
  .rule .handle { display: none; }
  .rule .rule-meta { grid-column: 1 / -1; justify-content: flex-end; flex-wrap: wrap; }
}
/* v4：分流表格、规则组、诊断、设置 */
table.dtable { table-layout: fixed; min-width: 1010px; }
table.dtable th, table.dtable td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.dtable select { width: 100%; padding: 3px 6px; }
table.dtable th.c, table.dtable td.c, table.dtable td.tc { overflow: visible; text-overflow: clip; }
a { color: var(--accent); }
.set.wide { grid-template-columns: minmax(0, 1fr) minmax(0, 560px); }
.wrap > *, #view > *, .panel > *, #grps, .grp { min-width: 0; }
.flow th, .flow td { white-space: nowrap; }
.flow td .chips { flex-wrap: nowrap; }
.iconbtn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; font-size: 13px; line-height: 1; }
.iconbtn:hover { color: var(--accent); background: var(--sunk); }
.dev-name { max-width: 100%; }
.dev-name .nm { overflow: hidden; text-overflow: ellipsis; }
.flow td { vertical-align: middle; }
.flow tr.off td:not(.keep) { opacity: .5; }
.flow tr.sel td { background: color-mix(in srgb, var(--accent-weak) 60%, var(--surface)); }
.flow tr.over td { box-shadow: inset 0 2px 0 var(--accent); }
.flow .handle { cursor: grab; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips .chip { padding: 1px 8px; font-size: 13px; }
.chip.neg { border-style: dashed; }
.ops { white-space: nowrap; text-align: right; }
.code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.lint-warn { color: var(--warn); }
.lint-bad { color: var(--bad); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
.cats button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 8px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
.cats button:hover { border-color: var(--accent); color: var(--accent); }
.checks { display: grid; }
.checks .row { padding: 9px 0; }
.steps { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps li::before { counter-increment: s; content: counter(s); width: 20px; height: 20px; border-radius: 50%; background: var(--sunk); color: var(--muted); font-size: 12px; display: grid; place-items: center; }
.steps .hit { color: var(--good); font-weight: 600; }
.steps .miss { color: var(--muted); }
.result { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; display: grid; gap: 6px; }
.log { display: grid; font-size: 13px; }
.log div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.log div:first-child { border-top: 0; }
.set { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 8px 20px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.set:first-of-type { border-top: 0; }
.set .lbl { display: grid; gap: 2px; }
.set .lbl b { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.set .lbl span { font-size: 12.5px; color: var(--muted); }
.set .ctl { justify-self: end; width: 100%; display: flex; justify-content: flex-end; gap: 8px; }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 6px 0; }
@media (max-width: 560px) { .set { grid-template-columns: minmax(0, 1fr); } .set .ctl { justify-content: flex-start; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <h1>智能分流</h1>
      <div class="proto"><b>界面原型</b> · 设备、地址和数字都是示例，点击操作不会改动任何真实设置</div>
    </div>
    <label class="switch" for="master"><input type="checkbox" id="master" checked><span class="track"></span><span id="master-label">已开启</span></label>
    <button class="btn primary" id="apply" disabled>保存并应用</button>
  </header>

  <nav class="tabs" aria-label="页面">
    <a href="#overview" data-tab="overview">概览</a>
    <a href="#flows" data-tab="flows">分流</a>
    <a href="#devices" data-tab="devices">设备组</a>
    <a href="#exits" data-tab="exits">出口</a>
    <a href="#sources" data-tab="sources">规则库</a>
    <a href="#diag" data-tab="diag">诊断</a>
    <a href="#prefs" data-tab="prefs">设置</a>
  </nav>

  <main id="view"></main>
</div>
<div id="layer"></div>
<div id="toast-host"></div>
<div class="tipbox" id="tipbox" role="tooltip" hidden></div>

<script>
(function () {
  /* ---------- 提示文字 ---------- */
  const T = {
    exit: "流量的转发去向：网关、路由器上的某条线路、直连或拦截。",

      ? `<div class="bulk"><span class="count">删除选中的 ${n} 条分流？</span><button class="btn small danger" data-act="bulk-del-yes">删除</button><button class="btn small" data-act="bulk-del-no">取消</button></div>`
      : `<div class="bulk"><span class="count">已选 ${n} 条</span>
          <select id="bulk-exit" aria-label="批量修改出口"><option value="">修改出口…</option>${S.exits.map(e => `<option value="${e.id}">${esc(exitLabel(e))}</option>`).join("")}</select>
          <button class="btn small" data-act="bulk-on">启用</button><button class="btn small" data-act="bulk-off">停用</button>
          <button class="btn small danger" data-act="bulk-del">删除</button><button class="btn small ghost" data-act="bulk-clear">取消选择</button></div>`;
    const all = S.flows.length && S.flows.every(f => S.sel.has(f.id));

      <tr class="${f.on ? "" : "off"}${S.sel.has(f.id) ? " sel" : ""}" draggable="true" data-id="${f.id}">

        <td class="order">${i + 1}</td>
        <td><div class="chips">${srcCell(f.src)}</div></td>
        <td><div class="chips">${rgCell(f)}</div></td>
        <td>${exitCell(f.exit)}</td>
        <td class="n">${f.on ? fmt(f.hits) : "—"}</td>
        <td class="keep"><label class="switch sm" title="${f.on ? "停用" : "启用"}"><input type="checkbox" data-act="toggle" data-id="${f.id}" ${f.on ? "checked" : ""} aria-label="启用第 ${i + 1} 条"><span class="track"></span></label></td>
        <td class="ops keep">${S.confirmDel === f.id
          ? `<span class="muted">删除？</span> <button class="btn small danger" data-act="del-yes" data-id="${f.id}">删除</button> <button class="btn small" data-act="del-no">取消</button>`
          : `<button class="btn small ghost" data-act="up" data-id="${f.id}" aria-label="上移" ${i === 0 ? "disabled" : ""}>↑</button><button class="btn small ghost" data-act="down" data-id="${f.id}" aria-label="下移" ${i === S.flows.length - 1 ? "disabled" : ""}>↓</button>
             <button class="btn small" data-act="edit" data-id="${f.id}">编辑</button><button class="btn small ghost danger" data-act="del" data-id="${f.id}">删除</button>`}</td>
      </tr>`).join("");
    return `<section class="panel">
      <div class="panel-head"><h2 class="h-tip">分流 ${tip("order")}</h2><button class="btn primary small" data-act="new">新建分流</button></div>

      ${bulk}
      ${S.flows.length ? `<div class="table-wrap"><table class="flow"><thead><tr><th class="c"><input type="checkbox" class="check" data-act="sel-all" ${all ? "checked" : ""} aria-label="全选"></th><th></th><th>#</th><th>设备</th><th><span class="h-tip">规则组 ${tip("rg")}</span></th><th>出口</th><th style="text-align:right">今日匹配</th><th>启用</th><th></th></tr></thead><tbody id="flow-body">${rows}</tbody></table></div>` : '<p class="hint">尚未配置分流。</p>'}
    </section>`;
  }
  function flowDialog(f) {
    const isNew = !f;
    f = f || { src: { all: true, groups: [], devs: [] }, rgs: [], not: false, exit: gw() ? gw().id : "e2" };
    const named = S.devs.filter(d => d.name);
    dialog(`<form class="dialog" id="flow-form" role="dialog" aria-modal="true" aria-labelledby="dlg-t">

        <div id="who-box" style="display:grid;gap:8px" ${f.src.all ? "hidden" : ""}>

            <h3>已命名设备</h3>${named.map(d => `<label data-k="${esc((d.name + d.mac + d.ip).toLowerCase())}"><input type="checkbox" class="check" name="d" value="${d.id}" ${f.src.devs.includes(d.id) ? "checked" : ""}><span class="dname">${esc(d.name)}</span><span class="mono muted">${esc(d.mac || d.ip)}</span></label>`).join("") || '<p class="hint" style="padding:4px 10px">暂无已命名设备</p>'}
          </div>
          <span class="help">设备需先加入设备组；未命名设备只能按设备组选择。<a href="#devices" data-close>管理设备组</a></span>
        </div>
      </div>
      <div class="field"><span class="label h-tip">规则组 ${tip("rg", "left")}</span>
        <div class="radios"><label><input type="radio" name="rgm" id="rg-all" ${f.rgs.length ? "" : "checked"}>全部</label>
        <label><input type="radio" name="rgm" id="rg-some" ${f.rgs.length ? "checked" : ""}>指定规则组（可多选）</label></div>
        <div id="rg-box" style="display:grid;gap:8px" ${f.rgs.length ? "" : "hidden"}>
          <div class="pick">${S.rgs.map(r => `<label><input type="checkbox" class="check" name="r" value="${r.id}" ${f.rgs.includes(r.id) ? "checked" : ""}><span class="dname">${esc(r.name)}</span><span class="code">${esc(r.lines.slice(0, 2).join(", "))}${r.lines.length > 2 ? " …" : ""}</span></label>`).join("")}</div>
          <span style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="check" id="not" ${f.not ? "checked" : ""}><label for="not" style="font-weight:400">取反</label>${tip("not")}</span>
        </div>
      </div>
      <div class="field"><label for="exit" class="h-tip">出口 ${tip("exit", "left")}</label>
        <select id="exit">${S.exits.map(e => `<option value="${e.id}" ${e.id === f.exit ? "selected" : ""}>${esc(exitLabel(e))}</option>`).join("")}</select>
      </div>
      <div class="preview"><div class="table-wrap"><table class="flow"><thead><tr><th>设备</th><th>规则组</th><th>出口</th></tr></thead><tbody><tr id="pv"></tr></tbody></table></div></div>
      <div class="dialog-foot"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary">${isNew ? "添加" : "保存"}</button></div>
    </form>`);
    const fm = $("#flow-form");
    const read = () => {
      const some = $("#rg-some").checked, rgs = some ? $$("input[name=r]:checked", fm).map(i => i.value) : [];
      return { src: { all: $("#who-all").checked, groups: $$("input[name=g]:checked", fm).map(i => i.value), devs: $$("input[name=d]:checked", fm).map(i => i.value) }, rgs, not: some && $("#not").checked, exit: $("#exit").value };
    };
    const pv = () => { const x = read(); $("#who-box").hidden = x.src.all; $("#rg-box").hidden = !$("#rg-some").checked;
      $("#pv").innerHTML = `<td><div class="chips">${x.src.all || x.src.groups.length || x.src.devs.length ? srcCell(x.src) : '<span class="muted">未选择</span>'}</div></td><td><div class="chips">${$("#rg-some").checked && !x.rgs.length ? '<span class="muted">未选择</span>' : rgCell(x)}</div></td><td>${exitCell(x.exit)}</td>`; };
    fm.addEventListener("input", pv); fm.addEventListener("change", pv);
    $("#who-q").addEventListener("input", e => { const q = e.target.value.trim().toLowerCase(); $$("#who-pick label", fm).forEach(l => { l.hidden = q && !l.dataset.k.includes(q); }); });
    pv();
    fm.addEventListener("submit", e => {
      e.preventDefault(); const x = read();
      if (!x.src.all && !x.src.groups.length && !x.src.devs.length) { toast("请至少选择一个设备组或设备，或选择“全部设备”"); return; }
      if ($("#rg-some").checked && !x.rgs.length) { toast("请至少选择一个规则组，或选择“全部”"); return; }
      if (x.src.all) { x.src.groups = []; x.src.devs = []; }
      if (isNew) S.flows.push({ id: S.nextFlow++, on: true, hits: 0, ...x }); else Object.assign(f, x);
      closeDialog(); touch(); render(); toast(isNew ? "已添加，保存并应用后生效" : "已修改，保存并应用后生效");
    });
  }

  /* ---------- 设备组 ---------- */
  function viewDevices() {
    return `<section class="panel">
      <div class="panel-head"><h2 class="h-tip">设备组 ${tip("groups")}</h2><button class="btn primary small" data-act="grp-new">新建设备组</button></div>
      <div id="dev-bulk"></div>
      <div id="grps"></div>
    </section>`;
  }
  const selKey = (gid, did) => gid + "|" + did;
  function refreshDevices() {
    $("#grps").innerHTML = S.groups.map(g => {
      const ms = members(g.id), closed = S.closed.has(g.id);
      const head = S.grpDel === g.id
        ? `<div class="grp-head"><span class="gname">删除“${esc(g.name)}”？</span><span class="muted">仅属于该组的设备将不再被插件记录（不影响设备联网）</span><button class="btn small danger" data-act="grp-del-yes" data-id="${g.id}">删除</button><button class="btn small" data-act="grp-del-no">取消</button></div>`
        : `<div class="grp-head"><button class="gname" data-act="grp-fold" data-id="${g.id}" aria-expanded="${!closed}"><span class="caret">▾</span>${esc(g.name)}<span class="muted num" style="font-weight:400">${ms.length} 台</span></button>
            <button class="btn small" data-act="grp-add" data-id="${g.id}">添加设备</button><button class="btn small ghost" data-act="grp-rename" data-id="${g.id}">重命名</button><button class="btn small ghost danger" data-act="grp-del" data-id="${g.id}">删除</button></div>`;
      const allSel = ms.length && ms.every(d => S.selDevs.has(selKey(g.id, d.id)));
      const body = closed ? "" : ms.length ? `<div class="table-wrap"><table class="dtable"><colgroup><col style="width:36px"><col style="width:170px"><col style="width:124px"><col style="width:168px"><col style="width:132px"><col style="width:196px"><col style="width:120px"><col style="width:64px"></colgroup><thead><tr><th class="c"><input type="checkbox" class="check" data-act="gsel-all" data-id="${g.id}" ${allSel ? "checked" : ""} aria-label="全选“${esc(g.name)}”"></th><th>名称</th><th><span class="h-tip">规则类型 ${tip("ident")}</span></th><th>MAC</th><th><span class="h-tip">当前 IP / 网段 ${tip("curip")}</span></th><th><span class="h-tip">IPv6 ${tip("v6col")}</span></th><th><span class="h-tip">厂商 ${tip("vendor")}</span></th><th>状态</th></tr></thead><tbody>${ms.map(d => {
          const k = selKey(g.id, d.id), on = online(d);
          const name = S.naming === k ? `<span class="dev-name"><input type="text" id="name-in" value="${esc(d.name)}" placeholder="输入名称" aria-label="设备名称"></span>`
            : `<span class="dev-name"><span class="nm" title="${esc(d.name)}">${d.name ? esc(d.name) : '<span class="unnamed">未命名</span>'}</span><button class="iconbtn" data-act="name" data-id="${k}" title="${d.name ? "重命名" : "命名"}" aria-label="${d.name ? "重命名" : "命名"} ${esc(devLabel(d))}">✎</button></span>`;
          return `<tr${S.selDevs.has(k) ? ' style="background:var(--accent-weak)"' : ""}><td class="c"><input type="checkbox" class="check" data-act="dsel" data-id="${k}" ${S.selDevs.has(k) ? "checked" : ""} aria-label="选择 ${esc(devLabel(d))}"></td>
            <td title="${d.groups.length > 1 ? `同时属于：${esc(d.groups.filter(x => x !== g.id).map(x => group(x).name).join("、"))}` : ""}">${name}${d.groups.length > 1 ? ` <span class="mini">+${d.groups.length - 1} 组</span>` : ""}</td>
            <td class="tc">${typeCell(d, k)}</td><td class="mono">${d.type === "mac" ? esc(d.mac) : linkedMac(d) ? `<span class="muted" title="通过 IP 关联的 MAC">${esc(linkedMac(d))}</span>` : "—"}</td><td class="mono">${esc(curIp(d) || "—")}</td><td>${v6Cell(d, k)}</td><td class="muted">${vendorCell(d.vendor)}</td>
            <td>${on === null ? '<span class="pill idle">网段</span>' : on ? '<span class="pill good">在线</span>' : '<span class="pill idle">离线</span>'}</td></tr>`;
        }).join("")}</tbody></table></div>` : `<p class="hint empty">该组暂无设备，点击“添加设备”从扫描结果中选择。</p>`;
      return `<div class="grp${closed ? " closed" : ""}">${head}${body}</div>`;
    }).join("") || `<p class="hint">尚未创建设备组。点击“新建设备组”后添加设备。</p>`;
    const n = S.selDevs.size;
    $("#dev-bulk").innerHTML = !n ? "" : `<div class="bulk"><span class="count">已选 ${n} 台</span>
      <select id="bulk-copy" aria-label="复制到"><option value="">复制到…</option>${S.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select>
      <select id="bulk-move" aria-label="移动到"><option value="">移动到…</option>${S.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select>
      <button class="btn small danger" data-act="bulk-out">移出所在组</button><button class="btn small ghost" data-act="dsel-clear">取消选择</button></div>`;
    if (S.naming) { const i = $("#name-in"); if (i) { i.focus(); i.select(); } }
  }
  function typeCell(d, k) {
    if (isCidr(d)) return `<span class="pill idle">IP 规则（网段）</span>`;
    const mac = linkedMac(d), ip = curIp(d);
    return `<select data-act="dtype" data-id="${k}" aria-label="规则类型" style="width:auto;padding:3px 8px">
      <option value="mac" ${d.type === "mac" ? "selected" : ""} ${mac ? "" : "disabled"}>MAC 规则</option>
      <option value="ip" ${d.type === "ip" ? "selected" : ""} ${ip && !ip.includes("/") ? "" : "disabled"}>IP 规则</option></select>`;
  }
  function v6Cell(d, k) {
    if (d.type === "mac") return `<span class="pill good">随 MAC 匹配</span>`;
    if (isCidr(d)) return `<span class="pill idle">${d.ip.includes(":") ? "按网段匹配" : "仅 IPv4 网段"}</span>`;
    return linkedMac(d) ? `<span class="pill good">已关联</span><button class="iconbtn" data-act="tomac" data-id="${k}" style="font-size:12.5px">改为 MAC 规则</button>`
      : `<span class="pill warn h-tip">仅 IPv4 生效 ${tip("v6none", "right")}</span>`;
  }
  function setType(k, type) {
    const d = dev(k.split("|")[1]);
    if (type === "mac") { const m = linkedMac(d); if (!m) { toast("未获取到该设备的 MAC，无法改为 MAC 规则"); return; } d.ip = curIp(d); d.mac = m; d.type = "mac"; }
    else { const ip = curIp(d); if (!ip || ip.includes("/")) { toast("该设备没有可用的 IP 地址"); return; } d.ip = ip; d.type = "ip"; }
    touch(); refreshDevices(); toast(`已改为${type === "mac" ? " MAC" : " IP"} 规则`);
  }
  function takeOut(pairs) {
    const after = new Map(S.devs.map(d => [d.id, d.groups.slice()]));
    pairs.forEach(([g, d]) => after.set(d, after.get(d).filter(x => x !== g)));
    const blocked = S.devs.filter(d => !after.get(d.id).length && S.flows.some(f => f.src.devs.includes(d.id)));
    if (blocked.length) { toast(`“${devLabel(blocked[0])}”被分流直接引用，至少需保留在一个设备组中`); return false; }
    S.devs.forEach(d => d.groups = after.get(d.id)); S.devs = S.devs.filter(d => d.groups.length); return true;
  }
  const selPairs = () => [...S.selDevs].map(k => k.split("|"));
  function saveName(commit) {
    const i = $("#name-in"); const d = S.naming && dev(S.naming.split("|")[1]); if (!i || !d) { S.naming = null; return; }
    if (commit) {
      const v = i.value.trim();
      if (v && S.devs.some(x => x !== d && x.name === v)) { toast("名称已被其他设备使用"); i.focus(); return; }
      if (!v && d.name && S.flows.some(f => f.src.devs.includes(d.id))) { toast("该设备被分流直接引用，名称不能为空"); i.focus(); return; }
      if (v !== d.name) { d.name = v; touch(); }
    }
    S.naming = null; refreshDevices();
  }
  function nameDialog(title, value, onOk, ph) {
    dialog(`<form class="dialog" id="n-form" role="dialog" aria-modal="true" aria-labelledby="n-t"><h2 id="n-t">${esc(title)}</h2>

    $("#n-in").focus(); $("#n-in").select();
  }
  function addDialog(gid) {

    const scanned = SCAN.map(s => { const d = S.devs.find(x => (x.type === "mac" && x.mac === s.mac) || (x.type === "ip" && x.ip === s.ip)); return { ...s, dev: d, inThis: !!(d && d.groups.includes(gid)) }; });
    dialog(`<form class="dialog" id="add-form" role="dialog" aria-modal="true" aria-labelledby="a-t" style="width:min(720px,100%)">
      <h2 id="a-t">添加设备到“${esc(g.name)}”</h2>
      <div class="field"><div class="toolbar"><span class="label h-tip" style="font-weight:600;font-size:13px">扫描到的设备 ${tip("scan", "left")}</span><span style="margin-left:auto"></span><button type="button" class="btn small" id="rescan">重新扫描</button></div>
        <input type="text" id="scan-q" placeholder="搜索名称、MAC、IP 或厂商">

          <tr class="${s.inThis ? "in" : ""}" data-k="${esc([s.host, s.mac, s.ip, s.vendor, s.dev ? s.dev.name : ""].join(" ").toLowerCase())}">
            <td class="c"><input type="checkbox" class="check" name="s" value="${i}" ${s.inThis ? "checked disabled" : ""} aria-label="选择 ${esc(s.mac)}"></td>
            <td>${s.dev ? `${s.dev.name ? esc(s.dev.name) : '<span class="unnamed">未命名</span>'}${s.inThis ? ' <span class="mini">已在本组</span>' : ' <span class="mini">在其他组</span>'}` : `<input type="text" name="n${i}" value="${esc(s.host)}" placeholder="可选" aria-label="${esc(s.mac)} 的名称">`}</td>
            <td>${s.dev ? `<span class="pill idle">${s.dev.type === "mac" ? "MAC 规则" : "IP 规则"}</span>` : `<select name="t${i}" aria-label="${esc(s.mac)} 的规则类型" style="width:auto;padding:3px 8px"><option value="mac">MAC 规则</option><option value="ip">IP 规则</option></select>`}</td>
            <td class="mono">${s.mac}</td><td class="mono">${s.ip}</td><td class="muted">${vendorCell(s.vendor)}</td>
            <td>${s.online ? '<span class="pill good">在线</span>' : '<span class="pill idle">离线</span>'}</td></tr>`).join("")}</tbody></table></div>
        <span class="help">名称默认填入设备上报的主机名，可修改。</span>
      </div>
      <div class="field"><label for="add-text">手动添加</label>
        <textarea id="add-text" style="min-height:80px" placeholder="格式：地址 名称（名称可省略）&#10;192.168.1.201 打印机&#10;10.8.0.0/24 公司 VPN"></textarea>
        <span class="help h-tip" id="add-count">MAC、IP 或网段，按行分隔，支持批量粘贴；MAC 地址按 MAC 规则添加，IP 与网段按 IP 规则添加 ${tip("cidr", "left")}</span></div>
      <div class="dialog-foot"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary" id="add-ok">添加</button></div>
    </form>`);

      const dupName = names.find((n, i) => names.indexOf(n) !== i || S.devs.some(d => d.name === n));
      if (dupName) { toast(`名称“${dupName}”已被使用`); return; }
      const before = snapshot(); let added = 0, skipped = 0;

        S.devs.push({ id: "d" + S.nextDev++, type: x.kind, name: x.name, mac: x.kind === "mac" ? x.a : "", ip: x.kind === "ip" ? x.a : "", vendor: "", groups: [gid] }); added++; });

  // 按分流顺序模拟一次匹配（演示数据）
  function trace(devId, dst) {
    const d = devId.startsWith("scan:") ? null : dev(devId);
    const scanned = d ? null : SCAN.find(s => "scan:" + s.mac === devId);
    const rec = DEMO_DNS[dst.toLowerCase()];
    const ip = rec ? rec.ip : addrKind(dst) === "ip" ? dst : null;
    const cats = rec ? rec.cats : ip && /^(110|114|223)\./.test(ip) ? ["geoip:cn"] : [];
    const inRg = r => r.lines.some(l => cats.includes(l) || (l.startsWith("domain:") && dst.endsWith(l.slice(7))) || (l.startsWith("full:") && dst.endsWith(l.slice(5))) || (ip && l === "10.0.0.0/8" && ip.startsWith("10.")));
    const steps = [];
    steps.push(`设备：<b>${d ? esc(devLabel(d)) : `未加入设备组的设备（${esc(scanned.ip)}）`}</b>${d ? `，属于 ${d.groups.map(g => esc(group(g).name)).join("、")}` : ""}`);
    steps.push(rec ? `目标：${esc(dst)} → <span class="mono">${rec.ip}</span>（域名记录，剩余 ${rec.ttl}）${cats.length ? `，属于 <span class="code">${cats.join(", ")}</span>` : ""}`
      : ip ? `目标：<span class="mono">${esc(ip)}</span>${cats.length ? `，属于 <span class="code">${cats.join(", ")}</span>` : ""}` : `目标：${esc(dst)}<span class="lint-warn">（暂无域名记录，设备需先通过 DNS 解析该域名）</span>`);
    let hit = null;
    S.flows.forEach((f, i) => {
      if (hit) return;
      if (!f.on) { steps.push(`<span class="miss">第 ${i + 1} 条：已停用，跳过</span>`); return; }
      const srcOk = f.src.all || (d && (f.src.devs.includes(d.id) || f.src.groups.some(g => d.groups.includes(g))));
      if (!srcOk) { steps.push(`<span class="miss">第 ${i + 1} 条：设备不匹配</span>`); return; }
      const m = f.rgs.length ? f.rgs.map(rg).filter(inRg) : [];
      const rgOk = !f.rgs.length || (f.not ? !m.length : m.length > 0);
      if (!rgOk) { steps.push(`<span class="miss">第 ${i + 1} 条：规则组不匹配${f.not ? "（取反）" : ""}</span>`); return; }
      hit = f; steps.push(`<span class="hit">第 ${i + 1} 条：匹配</span> ${f.rgs.length ? (f.not ? `（不属于 ${f.rgs.map(x => esc(rg(x).name)).join("、")}）` : `（规则组 ${m.map(x => esc(x.name)).join("、")}）`) : "（全部）"}`);
    });
    const e = hit ? exit(hit.exit) : null;
    steps.push(hit ? `出口：<b>${esc(exitLabel(e))}</b>${e.type === "gateway" && S.gwDown ? `<span class="lint-bad">（检测失败，实际使用${esc(exit(e.fallback).name)}）</span>` : ""}` : "均未匹配：<b>按主路由默认方式转发</b>");
    return `<div class="result"><ol class="steps">${steps.map(s => `<li><span>${s}</span></li>`).join("")}</ol></div>`;
  }
  function dnsLookup(q) {
    q = q.trim().toLowerCase(); if (!q) return "";
    const byName = DEMO_DNS[q], byIp = Object.entries(DEMO_DNS).filter(([, v]) => v.ip === q);
    if (byName) return `<div class="result"><div><b>${esc(q)}</b> → <span class="mono">${byName.ip}</span>　<span class="muted">剩余 ${byName.ttl}</span></div></div>`;
    if (byIp.length) return `<div class="result"><div><span class="mono">${esc(q)}</span> ← ${byIp.map(([n, v]) => `<b>${esc(n)}</b> <span class="muted">剩余 ${v.ttl}</span>`).join("、")}</div></div>`;
    return `<div class="result"><div class="muted">没有找到 ${esc(q)} 的记录。设备解析该域名后生成记录。</div></div>`;
  }

  /* ---------- 设置 ---------- */
  function viewPrefs() {
    const p = S.prefs;
    const sel = (k, opts, label) => `<select id="p-${k}" data-p="${k}" aria-label="${esc(label)}">${opts.map(o => typeof o === "string" ? `<option ${o === p[k] ? "selected" : ""}>${esc(o)}</option>` : `<option value="${o[0]}" ${o[0] === p[k] ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`;
    const sw = (k, label) => `<label class="switch" title="${esc(label)}"><input type="checkbox" data-p="${k}" ${p[k] ? "checked" : ""} aria-label="${esc(label)}"><span class="track"></span></label>`;
    const set = (title, desc, ctl, t, cls = "") => `<div class="set ${cls}"><div class="lbl"><b>${title}${t ? " " + tip(t, "left") : ""}</b>${desc ? `<span>${desc}</span>` : ""}</div><div class="ctl">${ctl}</div></div>`;
    return `<div style="display:grid;gap:16px">
      <section class="panel"><h2>常规</h2><div>
        ${set("工作接口", "读取 DNS 应答和判断流量的接口", sel("iface", ["br-lan", "br-guest", "eth1"], "工作接口"), "iface")}
        ${set("处理 IPv6", "关闭后 IPv6 流量不参与分流", sw("v6", "处理 IPv6"))}
        ${set("IPv6 未关联时", "IP 规则无法获取 MAC 时，设备 IPv6 流量的处理方式", sel("v6Unlinked", [["skip", "不参与分流"], ["reject", "拒绝 IPv6，设备回退到 IPv4"]], "IPv6 未关联时"), "v6unl")}
      </div></section>
      <section class="panel"><h2>域名记录</h2><div>
        ${set("最短保留时间", "DNS 应答有效期短于此值时按此值保留", sel("dnsMin", ["1 分钟", "5 分钟", "30 分钟"], "最短保留时间"), "dnsrec")}
        ${set("重启后保留", "路由器或插件重启后恢复已记录的域名", sw("dnsKeep", "重启后保留"))}
      </div></section>
      <section class="panel"><h2>连接</h2><div>
        ${set("已建立连接保持原出口", "修改分流不中断正在进行的连接", sw("keepConn", "已建立连接保持原出口"), "keep")}
        ${set("空闲超时", "连接空闲超过此时间后，按当前分流重新选择出口", sel("idle", ["5 分钟", "10 分钟", "30 分钟"], "空闲超时"))}
      </div></section>
      <section class="panel"><h2>规则数据文件</h2><div>
        ${set("geosite.dat 地址", "", `<input type="text" class="code" data-p="site" value="${esc(S.dat.site)}" aria-label="geosite.dat 地址">`, "dat", "wide")}
        ${set("geoip.dat 地址", "", `<input type="text" class="code" data-p="ipdat" value="${esc(S.dat.ip)}" aria-label="geoip.dat 地址">`, "", "wide")}
        ${set("自动更新时间", "每天", sel("updAt", ["02:00", "04:00", "06:00"], "自动更新时间"))}
        ${set("下载出口", "", sel("dlVia", S.exits.filter(e => e.type !== "builtin" || e.id === "e2").map(e => [e.id, exitLabel(e)]), "下载出口"), "dlvia")}
      </div></section>
      <section class="panel"><h2>兼容性</h2><div>
        ${set("自动放行转发给网关的流量", "防火墙开启“丢弃无效数据包”时仍可正常转发", sw("fixInvalid", "自动放行"), "invalid")}
        <details class="adv"><summary>高级</summary>
          ${set("流量标记", "", `<input type="text" class="mono" data-p="mark" value="${esc(p.mark)}" aria-label="流量标记">`, "mark")}
          ${set("路由表起始编号", "", `<input type="text" class="mono" data-p="table" value="${esc(p.table)}" aria-label="路由表起始编号">`)}
        </details>
      </div></section>
      <section class="panel"><h2>备份</h2><div>
        ${set("导出配置", "包含设备组、分流、出口、规则组和设置", `<button class="btn small" data-act="export">导出</button>`)}
        ${set("导入配置", "导入后需保存并应用", `<button class="btn small" data-act="import">导入</button>`)}
      </div></section>
    </div>`;
  }

  /* ---------- 渲染与事件 ---------- */
  const VIEWS = { overview: viewOverview, flows: viewFlows, devices: viewDevices, exits: viewExits, sources: viewSources, diag: viewDiag, prefs: viewPrefs };
  const tab = () => { const t = location.hash.slice(1); return VIEWS[t] ? t : "overview"; };
  function render() {
    const t = tab();
    $$(".tabs a").forEach(a => { if (a.dataset.tab === t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    $("#view").innerHTML = VIEWS[t]();
    if (t === "flows") bindDrag();
    if (t === "devices") refreshDevices();
    if (t === "diag") { $("#trace-out").innerHTML = trace($("#t-dev").value, $("#t-dst").value); }
  }
  window.addEventListener("hashchange", () => { S.confirmDel = null; S.bulkDel = false; S.naming = null; S.grpDel = null; closeDialog(); render(); });
  $("#master").addEventListener("change", e => { S.on = e.target.checked; $("#master-label").textContent = S.on ? "已开启" : "已关闭"; touch(); render(); });
  $("#apply").addEventListener("click", () => { S.dirty = 0; $("#apply").disabled = true; $("#apply").textContent = "保存并应用"; toast("已应用，3 秒内生效；已建立的连接不受影响"); });

  const move = (id, d) => { const i = S.flows.findIndex(f => f.id === id), j = i + d; if (j < 0 || j >= S.flows.length) return; [S.flows[i], S.flows[j]] = [S.flows[j], S.flows[i]]; touch(); render(); };
  const selFlows = () => S.flows.filter(f => S.sel.has(f.id));

  $("#view").addEventListener("submit", e => {
    e.preventDefault();
    if (e.target.id === "trace-form") $("#trace-out").innerHTML = trace($("#t-dev").value, $("#t-dst").value.trim());
    if (e.target.id === "dns-form") $("#dns-out").innerHTML = dnsLookup($("#dns-q").value);
  });
  $("#view").addEventListener("click", e => {
    const t = e.target.closest("[data-try]"); if (t) { $("#t-dst").value = t.dataset.try; $("#trace-out").innerHTML = trace($("#t-dev").value, t.dataset.try); return; }
    const b = e.target.closest("[data-act], #fix-invalid, #demo-gw, #demo-invalid"); if (!b) return;
    const raw = b.dataset.id, id = +raw || raw, act = b.dataset.act;
    if (b.id === "fix-invalid") { S.dropInvalid = false; render(); toast("已修复：转发给网关的流量不再被丢弃"); return; }
    if (b.id === "demo-gw") { S.gwDown = !S.gwDown; render(); toast(S.gwDown ? "网关检测失败，新建连接已切换到备用出口" : "网关已恢复，新建连接已切回"); return; }
    if (b.id === "demo-invalid") { S.dropInvalid = !S.dropInvalid; render(); return; }
    switch (act) {
      case "new": flowDialog(); break;
      case "edit": flowDialog(S.flows.find(f => f.id === id)); break;
      case "up": move(id, -1); break;
      case "down": move(id, 1); break;
      case "del": S.confirmDel = id; render(); break;
      case "del-no": S.confirmDel = null; render(); break;
      case "del-yes": { const i = S.flows.findIndex(f => f.id === id), [gone] = S.flows.splice(i, 1); S.sel.delete(id); S.confirmDel = null; touch(); render(); toast("已删除 1 条分流", () => { S.flows.splice(i, 0, gone); render(); }); break; }
      case "bulk-on": case "bulk-off": { const on = act === "bulk-on", n = selFlows().length; selFlows().forEach(f => f.on = on); touch(); render(); toast(`已${on ? "启用" : "停用"} ${n} 条分流`); break; }
      case "bulk-del": S.bulkDel = true; render(); break;
      case "bulk-del-no": S.bulkDel = false; render(); break;
      case "bulk-del-yes": { const before = S.flows.slice(), n = S.sel.size; S.flows = S.flows.filter(f => !S.sel.has(f.id)); S.sel.clear(); S.bulkDel = false; touch(); render(); toast(`已删除 ${n} 条分流`, () => { S.flows = before; render(); }); break; }
      case "bulk-clear": S.sel.clear(); render(); break;
      case "grp-new": nameDialog("新建设备组", "", v => { if (S.groups.some(g => g.name === v)) { toast("设备组名称已存在"); return false; } S.groups.push({ id: "g" + S.nextGroup++, name: v }); touch(); render(); toast(`已创建“${v}”`); }, "例如：孩子、办公电脑"); break;
      case "grp-rename": { const g = group(raw); nameDialog(`重命名“${g.name}”`, g.name, v => { if (S.groups.some(x => x !== g && x.name === v)) { toast("设备组名称已存在"); return false; } if (v !== g.name) { g.name = v; touch(); } render(); }); break; }
      case "grp-del": if (S.flows.some(f => f.src.groups.includes(raw))) { toast("该设备组被分流引用，请先修改相关分流"); break; } S.grpDel = raw; refreshDevices(); break;
      case "grp-del-no": S.grpDel = null; refreshDevices(); break;
      case "grp-del-yes": { const before = snapshot(), g = group(raw);
        if (!takeOut(members(raw).map(d => [raw, d.id]))) { S.grpDel = null; refreshDevices(); break; }
        S.groups = S.groups.filter(x => x.id !== raw); [...S.selDevs].forEach(k => { if (k.startsWith(raw + "|")) S.selDevs.delete(k); }); S.grpDel = null; touch(); render();
        toast(`已删除设备组“${g.name}”`, () => restore(before)); break; }
      case "grp-fold": S.closed.has(raw) ? S.closed.delete(raw) : S.closed.add(raw); refreshDevices(); break;
      case "grp-add": addDialog(raw); break;
      case "name": S.naming = raw; refreshDevices(); break;
      case "tomac": setType(raw, "mac"); break;
      case "dsel-clear": S.selDevs.clear(); refreshDevices(); break;
      case "bulk-out": { const before = snapshot(), n = S.selDevs.size; if (!takeOut(selPairs())) break; S.selDevs.clear(); touch(); render(); toast(`已将 ${n} 台设备移出所在组`, () => restore(before)); break; }
      case "new-exit": exitDialog(); break;
      case "exit-del":
        if (S.flows.some(f => f.exit === raw) || S.exits.some(x => x.fallback === raw)) { toast("该出口正在被分流或故障切换使用，请先修改"); break; }
        S.exits = S.exits.filter(x => x.id !== raw); touch(); render(); break;
      case "refind": b.outerHTML = '<span class="found"><span class="spin"></span>获取中</span>'; setTimeout(() => { render(); toast("已重新获取，地址未变化"); }, 1000); break;
      case "dat-update": S.dat.state = "busy"; render(); setTimeout(() => { S.dat.state = "ok"; S.dat.updated = "刚刚"; render(); toast("规则数据文件已是最新版本"); }, 1400); break;
      case "rg-new": rgDialog(); break;
      case "rg-edit": rgDialog(rg(raw)); break;
      case "rg-del": { const u = usedBy(raw); if (u) { toast(`该规则组被 ${u} 条分流引用，请先修改相关分流`); break; } const before = S.rgs.slice(); S.rgs = S.rgs.filter(r => r.id !== raw); touch(); render(); toast("已删除规则组", () => { S.rgs = before; render(); }); break; }
      case "diag-copy": copy([`智能分流诊断信息（示例）`, `插件：${S.on ? "已开启" : "已关闭"}，接口 ${S.prefs.iface}`, `网关 ${gw().name}：${S.gwDown ? "检测失败" : "正常"}`, `丢弃无效数据包：${S.dropInvalid ? "已开启（冲突）" : "未开启"}`, `分流 ${S.flows.length} 条，规则组 ${S.rgs.length} 个，设备组 ${S.groups.length} 个`].join("\n"), "诊断信息"); break;
      case "export": copy(JSON.stringify({ groups: S.groups, devs: S.devs, flows: S.flows, exits: S.exits, rgs: S.rgs, prefs: S.prefs }, null, 2), "配置"); break;
      case "import": dialog(`<form class="dialog" id="imp-form" role="dialog" aria-modal="true" aria-labelledby="imp-t"><h2 id="imp-t">导入配置</h2><div class="field"><label for="imp-text">粘贴导出的配置</label><textarea id="imp-text"></textarea></div><div class="dialog-foot"><button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit">导入</button></div></form>`);
        $("#imp-form").addEventListener("submit", ev => { ev.preventDefault(); try { const x = JSON.parse($("#imp-text").value); ["groups", "devs", "flows", "exits", "rgs"].forEach(k => { if (!Array.isArray(x[k])) throw 0; }); Object.assign(S, { groups: x.groups, devs: x.devs, flows: x.flows, exits: x.exits, rgs: x.rgs, prefs: x.prefs || S.prefs }); closeDialog(); touch(); render(); toast("已导入，保存并应用后生效"); } catch (_) { toast("内容不是有效的配置"); } }); break;
    }
  });

  $("#view").addEventListener("change", e => {
    const el = e.target, act = el.dataset.act;
    if (act === "sel") { el.checked ? S.sel.add(+el.dataset.id) : S.sel.delete(+el.dataset.id); S.bulkDel = false; render(); return; }
    if (act === "sel-all") { S.sel = el.checked ? new Set(S.flows.map(f => f.id)) : new Set(); S.bulkDel = false; render(); return; }
    if (act === "toggle") { const f = S.flows.find(x => x.id === +el.dataset.id); f.on = el.checked; touch(); render(); return; }
    if (el.id === "bulk-exit" && el.value) { const n = selFlows().length, ex = exit(el.value); selFlows().forEach(f => f.exit = el.value); touch(); render(); toast(`已将 ${n} 条分流的出口改为${exitLabel(ex)}`); return; }
    if (act === "dsel") { el.checked ? S.selDevs.add(el.dataset.id) : S.selDevs.delete(el.dataset.id); refreshDevices(); return; }
    if (act === "gsel-all") { members(el.dataset.id).forEach(d => { const k = selKey(el.dataset.id, d.id); el.checked ? S.selDevs.add(k) : S.selDevs.delete(k); }); refreshDevices(); return; }
    if ((el.id === "bulk-copy" || el.id === "bulk-move") && el.value) {
      const to = group(el.value), mv = el.id === "bulk-move", before = snapshot(), pairs = selPairs();
      pairs.forEach(([, d]) => { const x = dev(d); if (!x.groups.includes(to.id)) x.groups.push(to.id); });
      if (mv && !takeOut(pairs.filter(([g]) => g !== to.id))) { restore(before); return; }
      S.selDevs.clear(); touch(); render(); toast(`已将 ${pairs.length} 台设备${mv ? "移动" : "复制"}到“${to.name}”`, () => restore(before)); return;
    }
    if (act === "dtype") { setType(el.dataset.id, el.value); return; }
    if (el.id === "t-dev") { $("#trace-out").innerHTML = trace(el.value, $("#t-dst").value.trim()); return; }
    if (el.dataset.p) {
      const k = el.dataset.p, v = el.type === "checkbox" ? el.checked : el.value.trim();
      if (k === "site" || k === "ipdat") { if (!/^https?:\/\/\S+$/.test(v)) { toast("请输入 http 或 https 开头的地址"); el.value = k === "site" ? S.dat.site : S.dat.ip; return; } S.dat[k === "site" ? "site" : "ip"] = v; }
      else if (k === "mark" && !/^0x[0-9a-f]{1,8}$/i.test(v)) { toast("标记格式应为十六进制，例如 0x10"); el.value = S.prefs.mark; return; }
      else if (k === "table" && !(/^\d+$/.test(v) && +v >= 1 && +v <= 252)) { toast("路由表编号应在 1～252 之间"); el.value = S.prefs.table; return; }
      else S.prefs[k] = v;
      touch(); return;
    }
    if (el.dataset.k) {
      const ex = S.exits[+el.dataset.i], k = el.dataset.k, v = el.value.trim();
      if (k === "addr" && !(RE.v4.test(v) && !v.includes("/"))) { toast("请输入有效的 IPv4 地址，例如 192.168.1.2"); el.value = ex.addr; return; }
      if (k === "name") { if (!v) { toast("名称不能为空"); el.value = ex.name; return; } if (S.exits.some(x => x !== ex && x.name === v)) { toast("出口名称已存在"); el.value = ex.name; return; } }
      ex[k] = v; touch(); if (k === "name") render();
    }
  });
  $("#view").addEventListener("keydown", e => {
    if (e.target.id === "name-in") { if (e.key === "Enter") { e.preventDefault(); saveName(true); } else if (e.key === "Escape") { e.stopPropagation(); saveName(false); } }
  });
  $("#view").addEventListener("focusout", e => { if (e.target.id === "name-in" && S.naming) setTimeout(() => { if (S.naming && document.activeElement?.id !== "name-in") saveName(true); }, 0); });

  function bindDrag() {
    let dragId = null;
    $$("#flow-body tr").forEach(el => {
      el.addEventListener("dragstart", e => { dragId = +el.dataset.id; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(dragId)); } catch (_) {} });
      el.addEventListener("dragend", () => $$("#flow-body tr.over").forEach(x => x.classList.remove("over")));
      el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
      el.addEventListener("dragleave", () => el.classList.remove("over"));
      el.addEventListener("drop", e => {
        e.preventDefault(); const to = +el.dataset.id; if (dragId == null || to === dragId) return;
        const toIdx = S.flows.findIndex(f => f.id === to), [it] = S.flows.splice(S.flows.findIndex(f => f.id === dragId), 1);
        S.flows.splice(toIdx, 0, it);   // 往下拖落在目标之后，往上拖落在目标之前
        touch(); render();
      });
    });
  }

  // 问号提示：固定定位浮层，悬停、聚焦或点击显示
  const box = $("#tipbox"); let tipFor = null;
  function showTip(t) {
    tipFor = t; box.textContent = t.dataset.tip; box.hidden = false;
    const r = t.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight, m = 12;
    box.style.left = Math.min(Math.max(m, r.left + r.width / 2 - w / 2), innerWidth - w - m) + "px";
    box.style.top = (r.top - h - 8 >= m ? r.top - h - 8 : r.bottom + 8) + "px";
  }
  const hideTip = () => { tipFor = null; box.hidden = true; };
  document.addEventListener("mouseover", e => { const t = e.target.closest(".tip"); if (t) showTip(t); else if (tipFor) hideTip(); });
  document.addEventListener("focusin", e => { const t = e.target.closest(".tip"); t ? showTip(t) : hideTip(); });
  document.addEventListener("click", e => { const t = e.target.closest(".tip"); if (t) { e.preventDefault(); e.stopPropagation(); tipFor === t && !box.hidden ? hideTip() : showTip(t); } else hideTip(); }, true);
  addEventListener("scroll", hideTip, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#layer").innerHTML) closeDialog(); });
  render();
})();
</script>
</body>
</html>
