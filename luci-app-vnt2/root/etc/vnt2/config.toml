# ==================================
# VNT2 配置文件示例（程序版本 v2.0.0）
# ==================================

# --- 网络配置 ---
# 网络编号，相同网络编号的会组在同一个虚拟网 (必填)
# 请务必修改为你在控制台创建的网络编号
network_code = "YOUR_NETWORK_CODE"

# 服务器地址列表(支持 quic / tcp / wss / dynamic) (必填)
# 例如：
#   quic://server.example.com:7000
#   tcp://1.2.3.4:6000
# dynamic 协议使用 dns txt 解析记录值
server = ["quic://your-server:port"]

# ===简单使用以下参数可以不动===

# 自定义虚拟 IP (可选)
ip = ""

# 是否启用quic优化传输 (默认 false,设置为true时开启)
# rtx = false

# 是否启用 FEC 前向纠错，损失一定带宽来提升网络稳定性(默认 false,设置为true时开启)
# fec = false

# 是否关闭 P2P 打洞 (默认 false,设置为true时关闭)
# 一般建议保持默认（false），需要关闭打洞时再改为 true
no_punch = false

# 是否启用 LZ4 压缩 (默认 false,设置为true时开启)
# compress = false

# 入栈监听网段 (逗号分隔的 CIDR 和目标 IP)，用于点对网，将指定网段的流量发送到目标节点
input = [""]

# 出栈允许网段，用于点对网，允许指定网段的转发
output = ["0.0.0.0/0"]

# 是否关闭内置子网NAT，关闭(设为true)后需要配置网卡转发，否则无法使用点对网。
# 通常关闭内置子网NAT，使用系统的网卡转发，点对网性能会更好
# no_nat = false

# 是否关闭TUN虚拟网卡，关闭(设为true)后只能充当流量出口或者进行端口映射，关闭后无需管理员权限
# no_tun = false

# 端口映射，格式为：协议://本地监听地址-目标虚拟IP-目标映射地址
# 端口映射用于在本地监听指定端口，并将收到的网络流量经由指定虚拟节点转发到目标地址
# 例如 port_mapping = ["tcp://0.0.0.0:81-10.0.0.2-10.0.0.2:80"]
# tcp://0.0.0.0:81-10.0.0.2-10.0.0.2:80 表示将本地 tcp 的 81 端口的数据转发到 10.0.0.2:80
# tcp://0.0.0.0:81-10.0.0.2-192.168.1.10:80 表示将本地 tcp 的 81 端口的数据经过 10.0.0.2 转到 192.168.1.10:80
# tcp://0.0.0.0:81-10.0.0.2-anyonehost:80 表示将本地 tcp 的 81 端口的数据经过 10.0.0.2 转到 anyonehost:80
# port_mapping = []

# 是否允许作为端口映射出口，开启(设置为true)后其他设备才可使用本设备的ip为"目标虚拟IP"
# 开启后虚拟网络其他设备可以使用此设备当跳板访问其他网络
# allow_mapping = false

# 控制服务的 tcp 端口
# ctrl_port = 11233

# MTU 设置
# mtu = 1400

# --- 设备配置 ---

# 设备名称 (可选，默认读取本机 hostname)
device_name = ""

# 设备 ID (可选，不填自动生成，不同设备ID不能相同)
device_id = ""

# 虚拟网卡名称
tun_name = ""

# --- 安全配置 ---

# 加密密码 (可选)
# password = "123456"

# 证书校验方式：
#   skip     跳过验证（默认）
#   standard 使用系统证书验证
#   finger   使用证书指纹验证，服务端启动时日志会输出指纹，
#            例如 finger:3bdd8675606837cdf95d5e13445606315762315a78555f9da652940a25feaec1
# cert_mode = "skip"

# --- 其他配置 ---
# 自定义stun地址，分别用于udp打洞和tcp打洞，需要单独配置，不设置则用默认stun
# udp_stun = ["stun.chat.bilibili.com"]
# tcp_stun = ["stun.nextcloud.com:443"]
