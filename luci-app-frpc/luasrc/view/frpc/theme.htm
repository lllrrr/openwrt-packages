<%# luci-app-frpc 全局主题 — 紫色系卡片风格
     注入方式：在每个 frpc 顶层 lua 文件中 m:append(Template("frpc/theme"))
%>
<style>
/* ===== 1. 全局变量 ===== */
:root {
	--frpc-primary: #6366f1;
	--frpc-primary-dark: #4f46e5;
	--frpc-primary-light: #818cf8;
	--frpc-primary-bg: #eef2ff;
	--frpc-success: #10b981;
	--frpc-success-bg: #ecfdf5;
	--frpc-warn: #f59e0b;
	--frpc-warn-bg: #fffbeb;
	--frpc-danger: #ef4444;
	--frpc-danger-bg: #fef2f2;
	--frpc-text: #1f2937;
	--frpc-text-muted: #6b7280;
	--frpc-border: #e5e7eb;
	--frpc-border-soft: #f3f4f6;
	--frpc-bg: #f9fafb;
	--frpc-card-bg: #ffffff;
	--frpc-radius: 10px;
	--frpc-radius-sm: 6px;
	--frpc-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
	--frpc-shadow-hover: 0 4px 12px rgba(99,102,241,0.12), 0 2px 4px rgba(0,0,0,0.06);
}

/* ===== 2. 全局背景 ===== */
.cbi-map,
#maincontent {
	background: transparent;
}

/* ===== 3. Map 顶部 h2 标题 ===== */
.cbi-map > h2,
h2[name="content"] {
	color: var(--frpc-text);
	font-weight: 700;
	font-size: 24px;
	letter-spacing: -0.3px;
	padding: 18px 20px 12px;
	margin: 0 0 16px 0;
	background: var(--frpc-card-bg);
	border-radius: var(--frpc-radius);
	box-shadow: var(--frpc-shadow);
	border-left: 4px solid var(--frpc-primary);
}

/* Map 顶部描述（如 server-detail 顶部引导文案） */
.cbi-map-descr {
	color: var(--frpc-text-muted);
	background: var(--frpc-card-bg);
	padding: 14px 20px;
	border-radius: var(--frpc-radius);
	box-shadow: var(--frpc-shadow);
	margin: 0 0 16px 0;
	font-size: 13px;
	line-height: 1.6;
	border-left: 3px solid var(--frpc-primary-light);
}

/* ===== 4. fieldset 卡片化 ===== */
fieldset.cbi-section {
	background: var(--frpc-card-bg);
	border: none !important;
	border-radius: var(--frpc-radius);
	box-shadow: var(--frpc-shadow);
	padding: 18px 22px;
	margin: 0 0 16px 0;
	transition: box-shadow 0.2s;
}
fieldset.cbi-section:hover {
	box-shadow: var(--frpc-shadow-hover);
}
fieldset.cbi-section > legend,
fieldset.cbi-section > h3 {
	color: var(--frpc-text);
	font-weight: 600;
	font-size: 16px;
	padding: 0 6px;
	margin-bottom: 8px;
	background: transparent;
	border: none;
}

/* ===== 5. tab 栏 ===== */
.cbi-tabmenu,
ul.cbi-tabmenu {
	background: transparent;
	border-bottom: 1px solid var(--frpc-border);
	margin: 0 0 16px 0;
	padding: 0;
}
.cbi-tabmenu li,
ul.cbi-tabmenu li {
	background: transparent !important;
	border: none !important;
	margin: 0 4px 0 0 !important;
}
.cbi-tabmenu li a,
ul.cbi-tabmenu li a {
	color: var(--frpc-text-muted) !important;
	background: transparent !important;
	padding: 10px 18px !important;
	border-radius: var(--frpc-radius-sm) var(--frpc-radius-sm) 0 0 !important;
	font-weight: 500;
	transition: all 0.15s;
}
.cbi-tabmenu li a:hover {
	color: var(--frpc-primary) !important;
	background: var(--frpc-primary-bg) !important;
}
.cbi-tabmenu li.cbi-tab a,
ul.cbi-tabmenu li.cbi-tab a {
	color: var(--frpc-primary) !important;
	background: var(--frpc-card-bg) !important;
	border-bottom: 2px solid var(--frpc-primary) !important;
	font-weight: 600;
}

/* ===== 6. 按钮 ===== */
.cbi-button,
input.cbi-button,
button.cbi-button {
	border: 1px solid var(--frpc-border) !important;
	border-radius: var(--frpc-radius-sm) !important;
	padding: 6px 14px !important;
	font-weight: 500 !important;
	transition: all 0.15s !important;
	cursor: pointer;
	font-size: 13px !important;
	background: var(--frpc-card-bg) !important;
	color: var(--frpc-text) !important;
	box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.cbi-button:hover:not(:disabled) {
	transform: translateY(-1px);
	box-shadow: 0 2px 6px rgba(99,102,241,0.15);
}
.cbi-button-save,
.cbi-button-apply,
.cbi-button-add,
.cbi-button-positive,
input[value="保存"],
input[value="保存并应用"],
input[value="添加"] {
	background: var(--frpc-primary) !important;
	color: #fff !important;
	border-color: var(--frpc-primary) !important;
}
.cbi-button-save:hover,
.cbi-button-apply:hover,
.cbi-button-add:hover,
.cbi-button-positive:hover {
	background: var(--frpc-primary-dark) !important;
	border-color: var(--frpc-primary-dark) !important;
}
.cbi-button-edit,
.cbi-button-action {
	color: var(--frpc-primary) !important;
	border-color: var(--frpc-primary-light) !important;
}
.cbi-button-remove,
.cbi-button-negative,
.cbi-button-reset,
input[value="删除"],
input[value="复位"] {
	background: var(--frpc-card-bg) !important;
	color: var(--frpc-danger) !important;
	border-color: var(--frpc-danger) !important;
	opacity: 0.9;
}
.cbi-button-remove:hover,
.cbi-button-negative:hover,
.cbi-button-reset:hover {
	background: var(--frpc-danger) !important;
	color: #fff !important;
}

/* ===== 7. 表格 ===== */
.cbi-section-table,
table.cbi-section-table {
	background: transparent;
	border-collapse: separate;
	border-spacing: 0;
	width: 100%;
}
.cbi-section-table-titles,
.cbi-section-table-titles th,
tr.cbi-section-table-titles th {
	background: var(--frpc-border-soft) !important;
	color: var(--frpc-text-muted) !important;
	font-weight: 600 !important;
	text-transform: none !important;
	font-size: 12px !important;
	padding: 12px 14px !important;
	border: none !important;
	border-bottom: 1px solid var(--frpc-border) !important;
}
.cbi-section-table-titles th:first-child {
	border-top-left-radius: var(--frpc-radius-sm);
}
.cbi-section-table-titles th:last-child {
	border-top-right-radius: var(--frpc-radius-sm);
}
.cbi-section-table-descr th,
tr.cbi-section-table-descr th {
	background: transparent !important;
	color: var(--frpc-text-muted) !important;
	font-weight: 400 !important;
	font-style: normal !important;
	font-size: 11px !important;
	padding: 6px 14px !important;
	border: none !important;
}
.cbi-section-table-row,
tr.cbi-section-table-row {
	background: transparent !important;
	border: none !important;
	transition: background 0.12s;
}
.cbi-section-table-row:hover {
	background: var(--frpc-primary-bg) !important;
}
.cbi-section-table-row td,
tr.cbi-section-table-row td {
	background: transparent !important;
	border: none !important;
	border-bottom: 1px solid var(--frpc-border-soft) !important;
	padding: 12px 14px !important;
	color: var(--frpc-text);
}

/* ===== 8. 表单字段 ===== */
input[type="text"],
input[type="password"],
input[type="number"],
input[type="email"],
input[type="url"],
select,
textarea {
	border: 1px solid var(--frpc-border) !important;
	border-radius: var(--frpc-radius-sm) !important;
	padding: 6px 10px !important;
	background: var(--frpc-card-bg) !important;
	color: var(--frpc-text) !important;
	font-size: 13px !important;
	transition: all 0.15s !important;
	box-shadow: 0 1px 2px rgba(0,0,0,0.03) !important;
}
input[type="text"]:focus,
input[type="password"]:focus,
input[type="number"]:focus,
select:focus,
textarea:focus {
	outline: none !important;
	border-color: var(--frpc-primary) !important;
	box-shadow: 0 0 0 3px rgba(99,102,241,0.15) !important;
}
input[type="checkbox"] {
	accent-color: var(--frpc-primary);
	width: 16px;
	height: 16px;
	cursor: pointer;
}

/* ===== 9. 字段标签 .cbi-value-title ===== */
.cbi-value-title {
	color: var(--frpc-text);
	font-weight: 500;
	font-size: 13px;
}
.cbi-value-description {
	color: var(--frpc-text-muted);
	font-size: 12px;
	margin-top: 4px;
	line-height: 1.5;
}

/* ===== 10. 通用 hr 与分隔 ===== */
.cbi-section .cbi-value:not(:last-child) {
	border-bottom: 1px solid var(--frpc-border-soft);
}
.cbi-value {
	padding: 12px 0;
}

/* ===== 11. proxy/visitor type chip（在 rules 列表里给 type 字段加色块）===== */
/* 用 [class^=cbi-value-field] 注入类型样式比较麻烦，改用 JS 注入 chip 类
   见下方 inline script */
.frpc-type-chip {
	display: inline-block;
	padding: 3px 10px;
	border-radius: 999px;
	font-size: 11px;
	font-weight: 600;
	letter-spacing: 0.3px;
	text-transform: uppercase;
}
.frpc-type-tcp     { background: #dbeafe; color: #1e40af; }
.frpc-type-udp     { background: #fef3c7; color: #92400e; }
.frpc-type-http    { background: #d1fae5; color: #065f46; }
.frpc-type-https   { background: #fce7f3; color: #9d174d; }
.frpc-type-stcp    { background: #ede9fe; color: #5b21b6; }
.frpc-type-sudp    { background: #f3e8ff; color: #6b21a8; }
.frpc-type-xtcp    { background: #fae8ff; color: #86198f; }
.frpc-type-tcpmux  { background: #cffafe; color: #155e75; }

/* ===== 12. 「保存并应用」固定底部条美化 ===== */
.cbi-page-actions {
	background: var(--frpc-card-bg);
	border-radius: var(--frpc-radius);
	box-shadow: var(--frpc-shadow);
	padding: 14px 20px;
	margin-top: 16px;
	text-align: right;
}

/* ===== 13. CBI 错误/警告样式 ===== */
.errorbox,
.alert-message.warning,
.alert-message.error {
	border-radius: var(--frpc-radius-sm);
	padding: 12px 16px;
	border: none;
	box-shadow: var(--frpc-shadow);
}
.alert-message.error,
.errorbox {
	background: var(--frpc-danger-bg);
	color: var(--frpc-danger);
}
.alert-message.warning {
	background: var(--frpc-warn-bg);
	color: var(--frpc-warn);
}

/* ===== 14. 帮助提示样式 ===== */
.cbi-section .cbi-section-descr {
	background: var(--frpc-primary-bg);
	border-radius: var(--frpc-radius-sm);
	padding: 12px 14px;
	margin-bottom: 12px;
	color: var(--frpc-text);
	font-size: 13px;
	border-left: 3px solid var(--frpc-primary-light);
}

/* ===== 15. 链接 ===== */
.cbi-map a,
.cbi-section a {
	color: var(--frpc-primary);
	text-decoration: none;
}
.cbi-map a:hover {
	text-decoration: underline;
}

/* ===== 16. 滚动条美化 (webkit) ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--frpc-border-soft); }
::-webkit-scrollbar-thumb { background: var(--frpc-primary-light); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--frpc-primary); }
</style>
<script>
// === 独立、强制、持续覆盖：保证 LuCI 按钮文本一定正确 ===
// 不依赖 class 名（LuCI 不同版本 class 不一致），改用 onclick 内容推断
(function() {
	function inferButtonText(b) {
		var oc = (b.getAttribute('onclick') || '').toLowerCase();
		var cls = (b.className || '').toLowerCase();
		var title = (b.title || b.alt || '').toLowerCase();
		// 上/下移 — cbi_row_swap(this, true, ...) = up
		if (oc.indexOf('cbi_row_swap') >= 0) {
			if (oc.indexOf('true') >= 0) return '↑';
			if (oc.indexOf('false') >= 0) return '↓';
		}
		// 编辑 — onclick 跳转或 class 含 edit/action 或 title=Edit
		if (oc.indexOf("location.href") >= 0) return '编辑';
		if (cls.indexOf('cbi-button-edit') >= 0) return '编辑';
		if (cls.indexOf('cbi-button-action') >= 0 && title.indexOf('edit') >= 0) return '编辑';
		// 删除 — onclick 含 del-section 或 class 含 remove
		if (oc.indexOf('del-section') >= 0) return '删除';
		if (cls.indexOf('cbi-button-remove') >= 0) return '删除';
		// 添加
		if (cls.indexOf('cbi-button-add') >= 0) return '添加';
		return null;
	}
	function applyForce() {
		try {
			var btns = document.querySelectorAll(
				'tr.cbi-section-table-row input[type="button"],' +
				'tr.cbi-section-table-row input[type="submit"],' +
				'input.cbi-button-up, input.cbi-button-down,' +
				'input.cbi-button-edit, input.cbi-button-remove,' +
				'input.cbi-button-add'
			);
			for (var i = 0; i < btns.length; i++) {
				var b = btns[i];
				var want = inferButtonText(b);
				if (want && b.value !== want) {
					b.value = want;
					b.setAttribute('value', want);
				}
				// 用 inline style + !important 强制覆盖 Argon 主题
				// 只在首次 paint normal，避免 setInterval 反复覆盖 hover 状态
				var paint = function(el, normal, hover) {
					var apply = function(s) {
						for (var k in s) el.style.setProperty(k, s[k], 'important');
					};
					if (el._frpcPainted) return;
					el._frpcPainted = true;
					apply(normal);
					el.addEventListener('mouseenter', function(){ apply(hover); });
					el.addEventListener('mouseleave', function(){ apply(normal); });
				};
				if (b.className.indexOf('cbi-button-edit') >= 0) {
					paint(b,
						{ 'color': '#6366f1', 'background': '#ffffff', 'background-color': '#ffffff',
						  'border-color': '#c7d2fe', 'font-weight': '500' },
						{ 'color': '#ffffff', 'background': '#6366f1', 'background-color': '#6366f1',
						  'border-color': '#6366f1', 'font-weight': '500' });
				} else if (b.className.indexOf('cbi-button-remove') >= 0) {
					paint(b,
						{ 'color': '#ef4444', 'background': '#ffffff', 'background-color': '#ffffff',
						  'border-color': '#ef4444' },
						{ 'color': '#ffffff', 'background': '#ef4444', 'background-color': '#ef4444',
						  'border-color': '#ef4444' });
				}
			}
		} catch (e) {}
	}
	// 1. 立即跑
	applyForce();
	// 2. DOMContentLoaded
	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', applyForce);
	}
	// 3. setInterval 持续跑 10 秒（每 300ms 一次，共约 33 次），兜住所有迟到渲染
	var ticks = 0;
	var iv = setInterval(function() {
		applyForce();
		if (++ticks > 33) clearInterval(iv);
	}, 300);
	// 4. window.load
	window.addEventListener('load', applyForce);
})();

// 兜底：LuCI 翻译可能缺失，按钮 value 为空时填中文（更弱的兜底，仅覆盖空值）
function frpcEnsureButtonText() {
	var labels = {
		'cbi-button-edit':   '编辑',
		'cbi-button-up':     '↑',
		'cbi-button-down':   '↓',
		'cbi-button-remove': '删除',
		'cbi-button-add':    '添加',
		'cbi-button-save':   '保存',
		'cbi-button-apply':  '保存并应用',
		'cbi-button-reset':  '复位'
	};
	Object.keys(labels).forEach(function(cls) {
		document.querySelectorAll('input.' + cls).forEach(function(input) {
			if (!input.value || input.value.trim() === '' || /^(Edit|Up|Down|Delete|Add|Save|Apply|Reset)$/i.test(input.value.trim())) {
				input.value = labels[cls];
			}
		});
	});
}
// 上/下按钮做成图标按钮（紧凑 + 仅显示箭头）
var __frpcArrowStyle = document.createElement('style');
__frpcArrowStyle.textContent =
	/* 上/下按钮：静态样式，hover 不做翻转，避免误以为是删除/激活 */
	'input.cbi-button-up, input.cbi-button-down,' +
	'input.cbi-button-up:hover, input.cbi-button-down:hover,' +
	'input.cbi-button-up:hover:not(:disabled), input.cbi-button-down:hover:not(:disabled) {' +
	'  min-width: 32px !important; padding: 4px 8px !important;' +
	'  font-family: -apple-system, "Segoe UI Symbol", sans-serif !important;' +
	'  font-size: 14px !important; font-weight: 700 !important;' +
	'  color: var(--frpc-text-muted) !important;' +
	'  background: var(--frpc-card-bg) !important;' +
	'  background-color: var(--frpc-card-bg) !important;' +
	'  border-color: var(--frpc-border) !important;' +
	'  transform: none !important;' +
	'  box-shadow: 0 1px 2px rgba(0,0,0,0.04) !important;' +
	'}' +
	/* 「编辑」按钮：白底 + 紫字 + 紫边，与「删除」按钮对称风格 */
	'input.cbi-button-edit {' +
	'  background: var(--frpc-card-bg) !important;' +
	'  color: var(--frpc-primary) !important;' +
	'  border-color: var(--frpc-primary-light) !important;' +
	'  font-weight: 500 !important;' +
	'  min-width: 56px;' +
	'}' +
	'input.cbi-button-edit:hover:not(:disabled) {' +
	'  background: var(--frpc-primary) !important;' +
	'  color: #fff !important;' +
	'}';
document.head.appendChild(__frpcArrowStyle);

// 给规则列表的 type 字段套 chip 样式
(function() {
	function chipifyType() {
		// 匹配规则列表里"类型"列里的 select 或 dummy 文字
		document.querySelectorAll('tr.cbi-section-table-row').forEach(function(tr) {
			tr.querySelectorAll('td').forEach(function(td) {
				// type 字段：通常显示 tcp / udp / http / stcp / xtcp 等纯文本
				var text = (td.textContent || '').trim().toLowerCase();
				// 仅处理明确的 type 值（短且匹配协议名）
				if (text.length > 0 && text.length <= 8 &&
					/^(tcp|udp|http|https|stcp|sudp|xtcp|tcpmux)$/.test(text)) {
					// 该 td 不要包含 input/select（避免在编辑下拉里加 chip）
					if (td.querySelector('input, select, button, a')) return;
					if (td.querySelector('.frpc-type-chip')) return;
					var span = document.createElement('span');
					span.className = 'frpc-type-chip frpc-type-' + text;
					span.textContent = text;
					td.innerHTML = '';
					td.appendChild(span);
				}
			});
		});
	}
	function runAll() {
		chipifyType();
		frpcEnsureButtonText();
	}
	// 多次保险触发：DOMContentLoaded + 多次 setTimeout 兜住任何延迟渲染
	document.addEventListener('DOMContentLoaded', function() {
		runAll();
		// LuCI 4 某些表格可能 deferred render，再延迟几次跑
		setTimeout(runAll, 50);
		setTimeout(runAll, 300);
		setTimeout(runAll, 1000);
		setTimeout(runAll, 2500);
	});
	// 监听 DOM 变化（CBI 保存重渲染 / 折叠展开等）
	if (window.MutationObserver) {
		var mo = new MutationObserver(function() {
			// 节流：避免高频抖动
			if (mo._t) clearTimeout(mo._t);
			mo._t = setTimeout(runAll, 100);
		});
		document.addEventListener('DOMContentLoaded', function() {
			// 监听整个 body — 鲁棒兜住所有变化场景
			mo.observe(document.body, {
				childList: true,
				subtree: true,
				attributes: true,
				attributeFilter: ['value', 'class']
			});
		});
	}
	// window.load 时再跑一次（确保所有资源加载完）
	window.addEventListener('load', runAll);
})();
</script>
